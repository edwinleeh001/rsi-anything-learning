</style><script>try{const p=JSON.parse(localStorage.getItem('rsi-learning-preferences')||'{}');document.documentElement.dataset.theme=p.theme||'light';document.documentElement.lang=p.locale==='zh'?'zh-CN':'en'}catch{}</script><script type="module">const DEFAULTS=Object.freeze({preset:'misleading',lambda:0,eta:0.5,pairPass:true});
const labels=['A','B','C','D'];
function executeToyPatch(id,n=4){
 const original=n;let total=0;
 if(id==='A'||id==='B'){while(n>0){total+=n;n-=id==='A'?2:1}}
 else if(id==='C')total=n*n;
 else if(id==='D')total=n*(n+1)/2;
 else throw new Error('Unknown toy patch');
 const expected=original*(original+1)/2;return{result:total,expected,pass:Number(total===expected)};
}
function computeTrace(params={}){
 const p={...DEFAULTS,...params};
 const presets={misleading:[.86,.68,.35,.53],aligned:[.22,.84,.32,.66],cautious:[.85,.73,.39,.64]};
 const probabilities=presets[p.preset]||presets.misleading;
 const uncertainty=p.preset==='cautious'?[.40,.05,.10,.09]:[.08,.12,.06,.16];
 const candidates=labels.map((id,i)=>({id,p:probabilities[i],u:uncertainty[i],y:executeToyPatch(id).pass,result:executeToyPatch(id).result,score:probabilities[i]-p.lambda*uncertainty[i]}));
 const ranked=[...candidates].sort((a,b)=>b.score-a.score||a.id.localeCompare(b.id));
 const chosen=ranked[0]; const updated=chosen.p+p.eta*(chosen.y-chosen.p);
 const next=candidates.map(c=>({...c,p:c.id===chosen.id?updated:c.p})).map(c=>({...c,score:c.p-p.lambda*c.u}));
 const nextWinner=[...next].sort((a,b)=>b.score-a.score||a.id.localeCompare(b.id))[0];
 return {params:p,candidates,chosen,updated,next,nextWinner,retained:p.pairPass?next:candidates,oldError:(chosen.p-chosen.y)**2,newError:(updated-chosen.y)**2,steps:6};
}
function reliability({error=.35,threshold=.2,count=4,minCount=3,coverage=true,adaptCount=4,minAdapt=3,budget=5,cost=3,enabled=true}={}){
 const status=count<minCount||!coverage?'insufficient':error>threshold?'unreliable':'reliable';
 return {status,adapt:enabled&&status==='unreliable'&&adaptCount>=minAdapt&&budget>=cost};
}
function retain({policyAttempt=true,policyPass=true,modelAttempt=true,modelPass=true,pairPass=true}={}){
 const proposedPolicy=policyAttempt&&policyPass?'θ₁':'θ₀';
 const proposedModel=modelAttempt&&modelPass?'φ₁':'φ₀';
 const changed=proposedPolicy!=='θ₀'||proposedModel!=='φ₀';

function quiz(c){const q=c.check;if(!q)return'';return`<form class="quiz" data-quiz="${c.id}"><fieldset><legend>${t('Check your understanding','检查理解')}</legend><h4>${v(q.question)}</h4><div class="quiz-options">${val(q.options).map((a,i)=>`<label class="quiz-option"><input type="radio" name="answer-${c.id}" value="${i}" required><span>${esc(a)}</span></label>`).join('')}</div><button type="submit">${t('Check my answer','核对答案')}</button><div class="feedback" role="status"></div></fieldset></form>`}
function figureFor(c){const mapping={4:1,5:2,11:3,13:4,14:5,15:6,16:7};const id=mapping[c.id];if(!id)return'';const f=evidence.figures?.find(x=>x.id===id);if(!f)return'';return`<figure class="paper-figure"><div class="figure-heading"><h3>${v(f.title)}</h3><span class="badge">${t('Original paper figure','论文原图')} ${id}</span></div><img class="figure-image" src="${esc(f.src)}" alt="${v(f.title)}" loading="lazy" data-zoom="${esc(f.src)}"><figcaption>${v(f.caption)}</figcaption><ul class="figure-reading">${(val(f.reading)||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="inline-actions"><button class="zoom-button" data-zoom="${esc(f.src)}">${t('Inspect original','放大查看')}</button><a class="download-link" href="${esc(f.src)}" download>${t('Download figure','下载原图')}</a><a class="download-link" href="${esc(f.source?.url||'https://arxiv.org/html/2610.13912v1')}" target="_blank" rel="noopener">${t('Source and caption','原文与图注')}</a></div></figure>`}
function framework(){return`<section class="framework-wrap" id="framework"><div class="figure-heading"><h3>${t('The complete update-and-retention loop','完整的更新与保留闭环')}</h3><span class="badge">${t('Teaching synthesis · §2','教学概括 · §2')}</span></div><div class="framework-scroll" tabindex="0" aria-label="${t('Scrollable framework diagram','可滚动框架图')}">${frameworkSVG(0)}</div><div class="framework-buttons">${label.steps[l()].map((x,i)=>`<button data-framework="${i}" aria-pressed="${i===0}">${i+1}. ${esc(x)}</button>`).join('')}</div><div class="framework-text" aria-live="polite">${esc(flowExplain[l()][0])}</div><div class="inline-actions"><a class="download-link" href="media/framework-${l()}.svg" download>SVG</a><a class="download-link" href="media/framework-${l()}.png" download>PNG</a><a class="download-link" href="media/framework-workflow.html" target="_blank">${t('Open standalone workflow','打开独立流程图')}</a></div><small>${t('Explanatory diagram checked against Figure 2 and Equations 9–18. Domain implementations enable different pathways.','讲解图已对照 Figure 2 与公式 9–18 核验。各领域实现启用的路径不同。')}</small></section>`}
function repairLab(){return`<section class="activity" id="repair-lab"><span class="badge">${t('Computed toy · not a JEPA training run','可复算教学示例 · 非 JEPA 训练')}</span><h3>${t('Which patch receives real feedback?','哪个补丁获得真实反馈？')}</h3><p class="activity-intro">${t('Predict the winner, then step through one cycle. Probabilities and uncertainties are assigned teaching inputs. Outcomes come from a single local toy test. Only the selected patch enters the observation log.','先预测谁会被选中，再逐步运行一轮。概率与不确定性是指定教学输入，结果由本地单个教学测试计算；只有被选中的补丁会进入观察记录。')}</p><details class="disclosure" open><summary>${t('The repair task and four candidate patches','修复任务与四个候选补丁')}</summary><div class="detail-body"><p>${t('Task: sum the integers 1 through n. The original loop increments n and fails to terminate for positive n. The single toy test uses n = 4 and expects 10. The local deterministic evaluator computes the selected patch’s output; this is not the paper’s execution environment.','任务：求 1 到 n 的整数和。原始循环错误地增加 n，正整数输入时无法终止。教学测试固定 n = 4，期望值为 10。本地确定性计算器计算候选输出，不是论文的执行环境。')}</p><pre class="toy-code">total = 0
while n &gt; 0:
    total += n
    n += 1  # bug
return total</pre><div class="patch-grid"><div><b>A</b><code>n -= 2</code><small>${t('Replace the loop update','替换循环更新')}</small></div><div><b>B</b><code>n -= 1</code><small>${t('Replace the loop update','替换循环更新')}</small></div><div><b>C</b><code>return n * n</code><small>${t('Replace the whole function','替换整个函数')}</small></div><div><b>D</b><code>return n * (n + 1) // 2</code><small>${t('Replace the whole function','替换整个函数')}</small></div></div></div></details><div class="lab-controls"><label>${t('Scenario','情境')}<select id="lab-preset"><option value="misleading">${t('Confident but wrong','自信但预测错误')}</option><option value="aligned">${t('Accurate ranking','排序较准确')}</option><option value="cautious">${t('High uncertainty on A','A 的不确定性较高')}</option></select></label><label>${t('Uncertainty penalty λ','不确定性惩罚 λ')}<input id="lab-lambda" aria-label="${t('Uncertainty penalty','不确定性惩罚')}" type="range" min="0" max="1.5" step=".05" value="0"><output id="lambda-value">0.00</output></label><label>${t('Readout update rate η','读出更新步长 η')}<input id="lab-eta" aria-label="${t('Readout update rate','读出更新步长')}" type="range" min="0" max="1" step=".05" value=".5"><output id="eta-value">0.50</output></label><label><input type="checkbox" id="lab-pair" checked>${t('Pair passes acceptance (assumed outcome)','组合通过验收（假定结果）')}</label></div><small>${t('Score = p − λu. Scalar teaching update: p′ = p + η(y − p). Uncertainty u and the pair verdict are supplied inputs, not estimates or measured gate outcomes.','分数 = p − λu；标量教学更新：p′ = p + η(y − p)。u 和组合验收结果是给定输入，并非估计值或实测验收结果。')}</small><div class="steps">${label.steps[l()].map((s,i)=>`<button data-lab-step="${i}">${i+1}. ${esc(s)}</button>`).join('')}</div><div class="table-scroll"><table class="candidate-table"><thead><tr><th>${t('Patch','补丁')}</th><th>${t('Predicted pass p','预测通过 p')}</th><th>u</th><th>p − λu</th><th>${t('Observed y','观察 y')}</th></tr></thead><tbody id="candidate-body"></tbody></table></div><div class="stage-explanation" aria-live="polite" id="stage-explanation"></div><div class="observation-log" id="observation-log"></div><div class="playback"><button id="lab-play">${t('Play','播放')}</button><button id="lab-prev">${t('Previous','上一步')}</button><button id="lab-next">${t('Next','下一步')}</button><button id="lab-reset">${t('Restore defaults','恢复默认值')}</button><label>${t('Speed','速度')}<select id="lab-speed"><option value="1">1×</option><option value="2">2×</option><option value=".5">0.5×</option></select></label></div><input id="lab-seek" class="scrubber" type="range" min="0" max="5" step="1" value="0" aria-label="${t('Cycle step','闭环步骤')}"><small>${t('The local test result is revealed on observation. Passing one toy test does not prove a patch is correct for every input.','本地测试结果只在观察步骤显示。通过一个教学测试，不代表补丁对所有输入都正确。')}</small></section>`}
function reliabilityLab(){return`<section class="activity" id="reliability-lab"><span class="badge">${t('Computed decision rule · illustrative thresholds','可复算决策规则 · 阈值为教学设定')}</span><h3>${t('Unreliable, or not enough evidence?','不可靠，还是证据不够？')}</h3><p class="activity-intro">${t('This toy uses error > 0.20, at least 3 assessment records, at least 3 adaptation records, adequate coverage, and an adaptation cost of 3 units. These numbers are not paper hyperparameters.','教学规则设定：误差大于 0.20，评估记录至少 3 条、适配记录至少 3 条，覆盖足够，适配成本为 3 单位。它们不是论文超参数。')}</p><div class="lab-controls"><label>${t('Observed error','已观察误差')}<input id="rel-error" type="range" min="0" max="1" step=".01" value=".35"><output>.35</output></label><label>${t('Assessment records','评估记录数')}<input id="rel-count" type="range" min="0" max="8" step="1" value="4"><output>4</output></label><label>${t('Adaptation records','适配记录数')}<input id="rel-adapt" type="range" min="0" max="8" step="1" value="4"><output>4</output></label><label>${t('Remaining budget','剩余预算')}<input id="rel-budget" type="range" min="0" max="6" step="1" value="5"><output>5</output></label><label><input id="rel-coverage" type="checkbox" checked>${t('Relevant candidate range is covered','覆盖了相关候选范围')}</label><label><input id="rel-enabled" type="checkbox" checked>${t('Adaptation pathway enabled','启用模型适配路径')}</label></div><div id="reliability-result" class="decision-result" role="status"></div><button id="rel-reset">${t('Restore defaults','恢复默认值')}</button></section>`}
function retentionLab(){return`<section class="activity" id="retention-lab"><span class="badge">${t('Paper decision logic · Equations 13–18','论文决策逻辑 · 公式 13–18')}</span><h3>${t('A better component can still fail the pair check','组件变好，组合仍可能不通过')}</h3><p class="activity-intro">${t('Supply the check outcomes and inspect exactly which versions survive. The controls represent verdicts; they do not simulate how evaluation data produce those verdicts.','选择各项检查的结果，查看究竟保留哪个版本。开关代表验收结果，不模拟评估数据如何产生这些结果。')}</p><div class="toggle-grid"><label><input type="checkbox" id="gate-policy-attempt" checked>${t('Attempt policy update','尝试更新策略')}</label><label><input type="checkbox" id="gate-policy-pass" checked>${t('Policy component passes','策略组件通过检查')}</label><label><input type="checkbox" id="gate-model-attempt" checked>${t('Attempt world-model update','尝试更新世界模型')}</label><label><input type="checkbox" id="gate-model-pass" checked>${t('World-model component passes','模型组件通过检查')}</label><label><input type="checkbox" id="gate-pair-pass" checked>${t('Assembled pair passes compatibility','组装后的组合通过兼容性检查')}</label></div><div class="version-flow" style="margin-top:25px"><div>${t('Current pair','当前组合')}<strong>(θ₀, φ₀)</strong></div><span>→</span><div>${t('After component checks','组件检查之后')}<strong id="gate-proposed"></strong></div><span>→</span><div>${t('Retained pair','最终保留组合')}<strong id="gate-retained"></strong></div></div><div class="decision-result" id="gate-explanation" role="status"></div><div class="inline-actions"><button data-gate-preset="rollback">${t('Try pair failure','试试组合失败')}</button><button data-gate-preset="unchanged">${t('No component changes','两个组件都不变')}</button><button data-gate-preset="defaults">${t('Restore defaults','恢复默认值')}</button></div></section>`}
function codeEvidence(){const rows=evidence.tables?.code||[];return`<section class="activity"><span class="badge">${t('Reported results · Table 2','论文报告结果 · Table 2')}</span><h3>${t('Success under a shared coder and candidate budget','相同生成器与候选预算下的成功率')}</h3><small>${t('Bar scale: 0–35% hidden all-pass.','条形图刻度：隐藏测试全通过率 0–35%。')}</small><div class="bar-chart">${rows.map(r=>`<div class="bar-row"><span>${v(r.method)}</span><div class="bar"><i style="width:${r.success/35*100}%"></i></div><strong>${r.success.toFixed(1)}%</strong></div>`).join('')}</div><div class="table-scroll"><table class="evidence-table"><thead><tr><th>${t('Selection method','选择方法')}</th><th>${t('Hidden all-pass','隐藏测试全通过')}</th><th>${t('Online calls / task','每题在线测试调用')}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${v(r.method)}</td><td>${r.success.toFixed(1)}%</td><td>${r.calls.toFixed(2)}</td></tr>`).join('')}</tbody></table></div><p class="source">${t('200 tasks × 3 seeds; four repair candidates per round; at most three rounds. Online test feedback differs from final hidden-test evaluation. Similar test usage does not establish equal total compute.','200 题 × 3 个种子；每轮 4 个修复候选，最多 3 轮。在线反馈测试与最终隐藏测试分开；测试调用接近不等于总算力相同。')}</p></section>`}
function labEvidence(){const rows=evidence.tables?.lab||[];return`<section class="activity"><span class="badge">${t('Reported version scores · Figure 5','论文报告的版本分数 · Figure 5')}</span><h3>${t('Five retained policy versions','五个被保留的策略版本')}</h3><small>${t('Bar scale: 0–50% Final Score.','条形图刻度：Final Score 0–50%。')}</small><div class="bar-chart">${rows.map(r=>`<div class="bar-row"><span>${esc(r.version)}</span><div class="bar"><i style="width:${r.score/50*100}%"></i></div><strong>${r.score.toFixed(2)}%</strong></div>`).join('')}</div><small>${t('Version order is development order. Final Score measures protocol-aligned planning, not a measured physical execution success rate.','顺序表示开发版本顺序。Final Score 衡量流程对齐的规划表现，不是实测物理执行成功率。')}</small></section>`}
function bindings(){const rows=evidence.tables?.bindings||[];return`<section class="activity"><h3>${t('What actually changes in each domain?','各领域究竟改变了什么？')}</h3><div class="table-scroll"><table class="evidence-table"><thead><tr><th>${t('Domain','领域')}</th><th>${t('Policy / workflow','策略 / 工作流')}</th><th>${t('World model','世界模型')}</th><th>${t('Feedback','反馈')}</th><th>${t('Boundary','边界')}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${v(r.domain)}</td><td>${v(r.policy)}</td><td>${v(r.worldModel)}</td><td>${v(r.feedback)}</td><td>${v(r.limit)}</td></tr>`).join('')}</tbody></table></div><p class="source">${t('Table 4 + Experimental Methods; repository-specific clarifications are identified in the evidence audit.','Table 4 与实验方法；代码仓库补充说明见证据核验记录。')}</p></section>`}
function chapter(c){let extra='';if(c.id===5)extra=framework();if(c.id===6)extra=repairLab();if(c.id===9)extra=reliabilityLab();if(c.id===10)extra=retentionLab();if(c.id===12)extra=codeEvidence();if(c.id===14)extra=labEvidence();if(c.id===17)extra=bindings();return`<article class="chapter ${state.chapter===c.id?'onstage':''}" id="chapter-${c.id}" data-id="${c.id}"><div class="chapter-meta"><span>${t('Chapter','第')} ${String(c.id).padStart(2,'0')} ${t('','章')} / ${esc(label.parts[l()][c.part-1]||'')}</span><button class="mark-button" data-mark="${c.id}" aria-pressed="${state.done.includes(c.id)}">${state.done.includes(c.id)?t('Reviewed ✓','已复习 ✓'):t('Mark reviewed','标记已复习')}</button></div><h2>${v(c.title)}</h2><p class="question">${v(c.question)}</p><p class="lead">${v(c.summary)}</p><div class="prose">${(val(c.paragraphs)||[]).map(p=>`<p>${esc(p)}</p>`).join('')}</div>${formula(c.formula)}${extra}${figureFor(c)}<div class="takeaways"><h4>${t('Keep these distinctions','记住这些区别')}</h4><ul>${(val(c.takeaways)||[]).map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>${c.example?`<section class="example"><h4>${t('Make it concrete','用一个例子理解')}</h4><p>${v(c.example)}</p></section>`:''}${quiz(c)}<details class="disclosure notes"><summary><span>${t('Speaker notes','讲稿')} · ${state.notes==='zh'?'中文':'English'}<small class="note-kind">${t('Independent of body language','与正文语言独立')}</small></span></summary><div class="detail-body" lang="${state.notes==='zh'?'zh-CN':'en'}"><h4>${t('Concise presentation script','精简演示讲稿')}</h4><p>${v(c.talk,state.notes)}</p><h4>${t('Expanded study explanation','展开学习讲解')}</h4><p>${v(c.notes,state.notes)}</p></div></details><p class="source">${t('Source','来源')}: <a href="${esc(c.source?.url||'https://arxiv.org/html/2610.13912v1')}" target="_blank" rel="noopener">${esc(c.source?.label||'RSI-Anything v1')}</a></p></article>`}
function renderVideos(){const titles=t(['A complete improvement cycle','One repair, one real observation','Which version survives?'],['一轮完整的改进闭环','一次修复，一条真实观察','最后保留哪个版本？']);const descriptions=t(['Follow the six operations from proposal to retention.','Keep predictions separate from external test feedback.','See why component checks and pair checks differ.'],['从提出候选到验收保留，串起六个操作。','把候选预测与真正执行的测试反馈分开。','理解组件检查与组合检查为何不能合并。']);return`<div class="section-top"><h2>${t('Watch the mechanism unfold','用短视频串起机制')}</h2><p>${t('Three short animations, each with English and Chinese narration. Subtitles and scripts can be downloaded separately. Conceptual explanations, not recorded training runs.','三段短动画，每段都有中英文旁白版本，可单独下载字幕和脚本。画面用于概念讲解，不是训练过程录像。')}</p></div><div class="video-grid">${['loop','repair','retention'].map((id,i)=>`<article class="video-card" data-video="${id}"><video controls playsinline preload="none" poster="media/videos/${id}-${state.videoLocale}.jpg"><source src="media/videos/${id}-${state.videoLocale}.mp4" type="video/mp4"><track kind="captions" src="media/videos/${id}-${state.videoLocale}.vtt" srclang="${state.videoLocale}" label="${state.videoLocale==='zh'?'中文':'English'}"></video><h3>${esc(titles[i])}</h3><p>${esc(descriptions[i])}</p><div class="language-pills"><button data-video-language="zh" aria-pressed="${state.videoLocale==='zh'}">中文旁白</button><button data-video-language="en" aria-pressed="${state.videoLocale==='en'}">English voice</button></div><div class="inline-actions"><a data-video-download href="media/videos/${id}-${state.videoLocale}.mp4" download>MP4</a><a data-caption-download href="media/videos/${id}-${state.videoLocale}.srt" download>SRT</a><a href="sources/video-scripts.html" target="_blank">${t('Scripts & storyboard','讲稿与分镜')}</a></div></article>`).join('')}</div>`}
function renderGlossary(){return`<div class="section-top"><h2>${t('Terms you can return to','随时回看的术语表')}</h2><p>${t('Search in either language. Definitions explain the term in this paper’s context.','支持中英文检索。解释结合本文语境，避免只给出缩写的直译。')}</p></div><label><input id="term-search" type="search" placeholder="${t('Search: policy, retention, 世界模型…','搜索：策略、校准、world model…')}" aria-label="${t('Search glossary','搜索术语')}"></label><div class="term-grid">${lesson.glossary.map(g=>`<article class="term" data-search="${esc(JSON.stringify(g).toLowerCase())}"><h4>${esc(g.term)}</h4><p>${esc(g[l()]||g.en)}</p></article>`).join('')}</div><p id="term-empty" class="no-results" hidden>${t('No matching term. Try another keyword.','没有匹配的术语，请换个关键词。')}</p>`}

function initReliability(){const root=$('#reliability-lab');if(!root)return;const draw=()=>{const input={error:+$('#rel-error').value,count:+$('#rel-count').value,adaptCount:+$('#rel-adapt').value,budget:+$('#rel-budget').value,coverage:$('#rel-coverage').checked,enabled:$('#rel-enabled').checked};$$('input[type=range]',root).forEach(x=>x.nextElementSibling.textContent=x.value);const r=reliability(input);const status=t({reliable:'Reliable within observed coverage',unreliable:'Unreliable',insufficient:'Insufficient evidence'}[r.status],{reliable:'在已观察覆盖范围内可靠',unreliable:'不可靠',insufficient:'证据不足'}[r.status]);const why=r.status==='insufficient'?t('Too few current-version assessment records or inadequate candidate coverage. This does not count as reliable and does not activate adaptation.','当前版本评估记录太少，或候选范围覆盖不足。这不能算可靠，也不会触发适配。'):r.status==='reliable'?t('The observed error does not exceed the teaching threshold. No adaptation is triggered. This is not a guarantee outside the covered range.','已观察误差未超过教学阈值，不触发适配；这不保证覆盖范围以外也可靠。'):r.adapt?t('All trigger conditions hold: unreliability, sufficient adaptation data, enabled pathway and enough budget. Adaptation may be attempted; acceptance still requires checks.','不可靠、适配数据充分、路径启用、预算足够，所有触发条件满足。可以尝试适配；是否保留还需要验收。'):t('Unreliability alone is insufficient: check adaptation data, remaining budget and whether this pathway is enabled.','仅有不可靠还不够：还要检查适配数据、剩余预算与路径是否启用。');$('#reliability-result').innerHTML=`<strong>${esc(status)}</strong><p>${r.adapt?t('Attempt adaptation. ','尝试适配。 '):t('Keep the current predictor. ','保留当前预测器。 ')}${esc(why)}</p>`;root.dataset.status=r.status;root.dataset.adapt=String(r.adapt)};$$('input',root).forEach(x=>x.oninput=draw);$('#rel-reset').onclick=()=>{$('#rel-error').value='.35';$('#rel-count').value='4';$('#rel-adapt').value='4';$('#rel-budget').value='5';$('#rel-coverage').checked=true;$('#rel-enabled').checked=true;draw()};draw()}
function initRetention(){const root=$('#retention-lab');if(!root)return;const ids=['policy-attempt','policy-pass','model-attempt','model-pass','pair-pass'];const draw=()=>{const data={policyAttempt:$('#gate-policy-attempt').checked,policyPass:$('#gate-policy-pass').checked,modelAttempt:$('#gate-model-attempt').checked,modelPass:$('#gate-model-pass').checked,pairPass:$('#gate-pair-pass').checked};const r=retain(data);$('#gate-proposed').textContent=`(${r.proposedPolicy}, ${r.proposedModel})`;$('#gate-retained').textContent=`(${r.policy}, ${r.model})`;$('#gate-explanation').innerHTML=`<strong>${!r.changed?t('No new pair evaluation is needed','无需重新评估组合'):r.accepted?t('Keep the accepted candidate pair','保留通过验收的候选组合'):t('Roll back the entire pair','整对回退')}</strong><p>${!r.changed?t('Neither component changed. The old pair carries forward. The cycle still counts as an update-and-acceptance cycle.','两个组件都没有改变，直接沿用旧组合。这一轮仍计为一次更新与验收循环。'):r.accepted?t('A failed or unattempted component keeps its current version; passing components form the candidate pair, and the pair verdict permits retention.','未尝试或未通过的组件保留当前版本；通过的组件组成候选组合，组合验收通过后才能保留。'):t('Even if one or both component checks pass, pair failure preserves (θ₀, φ₀). A locally improved predictor may be unsuitable for the candidates produced by a changed policy.','即使一个或两个组件检查通过，组合失败仍保留 (θ₀, φ₀)。局部预测更好的模型，可能不适合新策略提出的候选。')}</p>`;root.dataset.pair=`${r.policy},${r.model}`};ids.forEach(id=>$('#gate-'+id).onchange=draw);$$('[data-gate-preset]').forEach(b=>b.onclick=()=>{ids.forEach(id=>$('#gate-'+id).checked=true);if(b.dataset.gatePreset==='rollback')$('#gate-pair-pass').checked=false;if(b.dataset.gatePreset==='unchanged'){$('#gate-policy-attempt').checked=false;$('#gate-model-attempt').checked=false}draw()});draw()}

let timerStart=0,timerInterval=0,timerMode='talk',talkElapsed=0,qaElapsed=0;
function togglePresent(){state.present=!state.present;document.body.classList.toggle('presenting',state.present);$('#present').textContent=state.present?t('Read','阅读'):t('Present','演示');$('#presentation-bar').hidden=!state.present;if(state.present){timerStart=performance.now();timerInterval=setInterval(updateTimer,1000);showStage(state.chapter);window.scrollTo(0,0)}else{clearInterval(timerInterval);document.exitFullscreen?.().catch(()=>{});$('#chapter-'+state.chapter)?.scrollIntoView()} }
function showStage(id){state.chapter=Math.max(1,Math.min(20,id));$$('.chapter').forEach(c=>c.classList.toggle('onstage',+c.dataset.id===state.chapter));$('#presentation-bar').innerHTML=`<button id="stage-prev" ${state.chapter===1?'disabled':''}>${t('Previous','上一章')}</button><select id="stage-select" aria-label="${t('Choose chapter','选择章节')}">${lesson.chapters.map(c=>`<option value="${c.id}" ${state.chapter===c.id?'selected':''}>${c.id}. ${v(c.title)}</option>`).join('')}</select><button id="stage-next" ${state.chapter===20?'disabled':''}>${t('Next','下一章')}</button><button id="stage-notes">${t('Notes','讲稿')}</button><button id="stage-notes-language">${state.notes==='zh'?'讲稿：中文':'Notes: English'}</button><button id="fullscreen">${t('Fullscreen','全屏')}</button><span class="timer" id="talk-clock"></span><button id="timer-mode">${timerMode==='talk'?t('Start Q&A','开始问答'):t('Resume talk','继续主讲')}</button><button id="exit-stage">Esc</button>`;$('#stage-prev').onclick=()=>showStage(state.chapter-1);$('#stage-next').onclick=()=>showStage(state.chapter+1);$('#stage-select').onchange=e=>showStage(+e.target.value);$('#stage-notes').onclick=()=>{const d=$('#chapter-'+state.chapter+' .notes');d.open=!d.open};$('#stage-notes-language').onclick=()=>{state.notes=state.notes==='zh'?'en':'zh';$('#notes-locale').value=state.notes;$('#notes-locale').dispatchEvent(new Event('change'));showStage(state.chapter)};$('#fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{})};$('#exit-stage').onclick=togglePresent;$('#timer-mode').onclick=()=>{const d=(performance.now()-timerStart)/1000;if(timerMode==='talk')talkElapsed+=d;else qaElapsed+=d;timerMode=timerMode==='talk'?'qa':'talk';timerStart=performance.now();showStage(state.chapter)};updateTimer();window.scrollTo(0,0);$$('video').forEach(x=>x.pause())}
function updateTimer(){const el=$('#talk-clock');if(!el)return;const d=(performance.now()-timerStart)/1000;const format=s=>`${Math.floor(s/60).toString().padStart(2,'0')}:${Math.floor(s%60).toString().padStart(2,'0')}`;el.textContent=`${t('Talk','主讲')} ${format(talkElapsed+(timerMode==='talk'?d:0))} / 30:00 · Q&A ${format(qaElapsed+(timerMode==='qa'?d:0))} / 10:00`}
document.addEventListener('visibilitychange',()=>{if(document.hidden)$$('video').forEach(v=>v.pause())});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.present&&!$('#figure-dialog').open){e.preventDefault();togglePresent();return}if(!state.present||e.target.closest('input,select,textarea,video,dialog,.activity,.framework-wrap')||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'){e.preventDefault();showStage(state.chapter+1)}if(e.key==='ArrowLeft'){e.preventDefault();showStage(state.chapter-1)}});
try{[lesson,evidence]=[{"title":{"en":"RSI-Anything: Learning to improve with world models","zh":"RSI-Anything：借助世界模型，学习如何持续改进"},"parts":[{"id":1,"title":{"en":"Build the intuition","zh":"建立直觉"},"chapters":[1,2,3,4]},{"id":2,"title":{"en":"Follow one complete cycle","zh":"走完一次完整闭环"},"chapters":[5,6,7,8,9,10]},{"id":3,"title":{"en":"Read the evidence","zh":"读懂实验与证据"},"chapters":[11,12,13,14,15,16]},{"id":4,"title":{"en":"Judge the contribution","zh":"判断贡献与边界"},"chapters":[17,18,19,20]}],"chapters":[{"id":1,"slug":"why-recursive","part":1,"title":{"en":"Can one round make the next round better?","zh":"这一轮，怎样让下一轮更好？"},"question":{"en":"What must change before we call a system self-improving?","zh":"怎样的变化，才算系统能力发生了改进？"},"summary":{"en":"RSI turns experience into accepted, persistent changes to the system that acts next.","zh":"RSI 把经验转化为被验收、被保留、能够影响后续决策的系统变化。"},"paragraphs":{"en":["Imagine a repair assistant that fails a test, reads the error, and tries another patch. It has used feedback inside a task. Now imagine that it also improves its predictor or saves a better repair workflow, and uses that accepted version in later decisions. This second change is the persistent improvement studied here.","The paper places the unit of improvement at the policy–world-model pair. The policy generates or selects actions; the world model forecasts their consequences. Their interaction matters: a changed policy may ask the predictor about unfamiliar actions, and a changed predictor may reorder the policy’s choices. Better components therefore need to work well together.","The research question is practical: under limited external feedback, how can predictions help choose useful actions, how can observations support updates, and which updated versions should survive? The paper offers a protocol connecting prediction, execution, learning, and acceptance. Its experiments examine different parts of this protocol across computational and scientific domains."],"zh":["先想象一个修复程序的助手：测试失败后，它阅读错误信息，再尝试一个补丁。这是在任务内部利用反馈。如果它还改好了预测器，或保存了更有效的修复流程，并在后续决策中使用验收后的版本，就发生了本文关心的持久改进。","本文把“策略与世界模型组成的系统”作为改进单位。策略负责提出或选择行动，世界模型负责预测后果。两者的配合很重要：新策略可能提出预测器不熟悉的行动，新预测器可能改变最终采用的候选。因此，组件各自变好，还需要验证组合是否好用。","研究问题很具体：外部反馈有限时，预测怎样帮助选择值得尝试的行动？观察怎样支持更新？更新后应保留哪个版本？本文给出连接预测、执行、学习与验收的流程，并在计算任务和科学领域分别检验其中的不同环节。"]},"takeaways":{"en":["An observation is experience; an accepted revision changes the system.","The retained pair shapes the next round.","Each experiment supports a particular part of the framework."],"zh":["观察提供经验；验收修订改变系统。","下一轮由保留下来的组合继续决策。","每项实验支撑框架中的特定环节。"]},"example":{"en":"Teaching example: saving “the last patch failed” extends the task record. Accepting a predictor that ranks future patches better changes the system. This is a conceptual example, not a reported benchmark run.","zh":"教学例子：保存“上次补丁失败”扩展的是任务记录；验收一个能更好排序后续补丁的预测器，改变的是系统。此例用于说明概念，不是论文中的实测运行。"},"notes":{"en":"Open with a familiar debugging story and ask what survives after the current attempt. Separate an error message, a revised program, and a revised assistant: they belong to different objects. The paper’s definition concerns the configuration making later decisions. Emphasize that a policy can be a persistent workflow, not only neural weights. Introduce the world model as a forecasting role rather than an all-knowing simulator. Explain how this lesson will judge the paper: first understand the protocol, then map each experiment to the pathway it actually enables, and finally discuss whether the evidence establishes sustained mutual improvement. Merely increasing the number of attempts is not sufficient evidence.","zh":"先用熟悉的调试故事开场，追问本次尝试结束后究竟留下什么。区分错误消息、修改后的程序和修改后的助手，它们属于不同对象。本文关注负责后续决策的配置。策略可以是持久工作流，不一定只有神经网络权重；世界模型承担预测职责，也并非知道一切。交代学习路线：先理解协议，再把实验对应到实际启用的路径，最后判断证据能否建立持续相互促进的结论。单纯增加尝试次数，还不能充分证明系统本身变得更好。"},"talk":{"en":"Start with a debugging assistant. It fails, reads the error, and tries again. Feedback is useful, but what has the assistant itself learned? RSI-Anything asks how experience can change the system used next time. Its central components are a policy that proposes actions and a world model that predicts consequences. The key is to retain accepted changes, so later decisions and learning depend on them. We will follow that loop, then check which experiments support each link. That distinction will guide every experiment we read.","zh":"从调试助手开始：它失败、读取错误，再试一次。反馈很有用，但助手本身究竟学到了什么？RSI-Anything 关注经验怎样改变下一次使用的系统。两个核心组件是提出行动的策略和预测后果的世界模型。关键是验收并保留系统变化，让后续决策和学习受到影响。我们先走完闭环，再检查每组实验证据支持了哪个环节。 这一点将贯穿后面的实验解读。"},"source":{"label":"§1 Introduction","url":"https://arxiv.org/html/2610.13912v1#S1"},"figure":1,"check":{"question":{"en":"Which change is a system revision?","zh":"哪一种变化属于系统修订？"},"options":{"en":["Appending a test log","Accepting a revised predictor for later selection","Trying another patch"],"zh":["追加测试日志","验收用于后续选择的新预测器","再尝试一个补丁"]},"answer":1,"explanation":{"en":"The accepted predictor changes the decision system; the other actions change history or task state.","zh":"验收预测器会改变决策系统；其他行动改变历史或任务状态。"}}},{"id":2,"slug":"two-clocks","part":1,"title":{"en":"Two clocks: actions and system revisions","zh":"两只时钟：行动步骤与系统修订"},"question":{"en":"Why does another action not automatically create another system version?","zh":"为什么多做一步行动，不等于产生一个新系统版本？"},"summary":{"en":"t tracks interaction steps; k tracks update and acceptance cycles.","zh":"t 记录交互步骤；k 记录更新与验收周期。"},"paragraphs":{"en":["The task clock advances when an action is taken: a patch is executed, a box is clicked, or an outcome is measured. These events change the task state or available information. The update clock advances when the system decides whether to propose and retain a policy or predictor revision. One cycle may aggregate several task steps.","Within a run, objectives, interfaces, scoring criteria, constraints, acceptance rules, stopping rules, and total budget limits stay fixed. Task states, feedback records, remaining resources, and accepted component versions can change. Separating these categories prevents an apparent improvement obtained merely by changing the goal or making the evaluation easier.","A cycle may end with exactly the same policy and world model. An update pathway might be disabled, evidence might be insufficient, or a proposed revision might fail a check. The index k still advances because an update-and-acceptance decision has occurred. Cycle count therefore does not equal the number of successful retained revisions."],"zh":["执行行动时，任务时钟向前一步：运行补丁、点击复选框或测量结果，都会改变任务状态或可用信息。系统判断是否提出并保留策略或预测器修订时，更新时钟推进。一个更新周期可以汇总多个行动步骤、轨迹或任务的反馈。","一次运行中，目标、接口、评分、约束、验收规则、停止规则和总预算上限保持固定；任务状态、反馈记录、剩余资源和已接受版本可以变化。区分这些对象，才能避免把改变目标或降低评估难度造成的表面进步，当成系统能力提高。","周期结束后，策略和模型可能都没变化：更新路径可能没启用，证据可能不足，候选修订也可能没通过检查。此时 k 仍会增加，因为系统完成了一次更新与验收决策。因此，周期数量不等于成功保留的修订数量。"]},"takeaways":{"en":["t and k count different events.","History growth alone does not revise θ or φ.","The task contract stays fixed while accepted versions evolve."],"zh":["t 与 k 统计不同事件。","历史增长本身不等于修订 θ 或 φ。","任务契约固定，已接受的系统版本可以演化。"]},"example":{"en":"Teaching example: three test executions produce three records inside one cycle. A candidate predictor is then rejected. Cycle k+1 starts with the old pair and a longer history.","zh":"教学例子：一个周期运行三次测试，得到三条记录。随后候选预测器被拒绝，k+1 周期继续使用旧组合，但拥有更长的反馈历史。"},"notes":{"en":"Draw two timelines. Put three action markers on the first and one update decision on the second. Ask what object changes at each marker. A repaired program belongs to task state; the code-generating model belongs to policy configuration. This distinction becomes essential in the fixed-coder experiment. Explain that rejected versions still consume resources: failed experiments and adaptation attempts are not free. The paper fixes acceptance rules within a run to keep comparisons meaningful. A no-change decision is legitimate, and preserving a functioning current pair can be preferable to accepting an unsupported revision. Avoid saying that every completed cycle necessarily improves performance or creates a new model.","zh":"画两条时间线，上面放三次行动，下面放一次更新决策。逐个询问发生变化的对象：被修好的程序属于任务状态，生成代码的模型属于策略配置。这是理解固定代码生成器实验的关键。被拒绝的版本同样消耗资源，失败实验和适配尝试并不免费。论文要求一次运行中验收规则保持固定，使比较有意义。不改变版本是合法决定；继续保留可用组合，有时比接受证据不足的修订更合理。不要把每完成一个周期说成性能一定提高，或必然产生新模型。"},"talk":{"en":"There are two clocks. One counts actions inside a task; the other counts decisions about system versions. Several tests can happen before one update decision, and that decision may retain the old pair. Meanwhile, objectives and evaluation rules stay fixed. This matters for code repair: changing the program is an action, while changing the coder is a policy update. Whenever we hear “improvement,” ask what changed and what will make the next decision.","zh":"这里有两只时钟：一只统计任务内部的行动，一只统计系统版本决策。可以先做几次测试，再进行更新判断；结果也可能是保留旧组合。目标和评估规则则保持固定。对代码修复来说，改程序是行动，改编码模型才是策略更新。每遇到“改进”，我们都追问：究竟改变了什么，下一步由谁负责决策？"},"source":{"label":"§2.1 · Table 1","url":"https://arxiv.org/html/2610.13912v1#S2.SS1"},"check":{"question":{"en":"Can a cycle end without a new component version?","zh":"一个周期能否没有新组件版本？"},"options":{"en":["Yes; current versions can be retained","No; k counts successful improvements","Only if no action happened"],"zh":["能，可以保留当前版本","不能，k 统计成功改进","只有没有行动时才可以"]},"answer":0,"explanation":{"en":"A cycle records update and acceptance decisions, including retaining both current components.","zh":"周期统计更新与验收决策，也包括保留两个当前组件。"}}},{"id":3,"slug":"feedback-is-scarce","part":1,"title":{"en":"Predict before paying for feedback","zh":"先预测，再付出反馈成本"},"question":{"en":"If execution gives the answer, why build a predictor?","zh":"执行后就知道答案，为什么还要预测器？"},"summary":{"en":"Forecasts can focus expensive evaluations, while executions supply observations.","zh":"预测可以集中昂贵的评估机会，执行才产生观察。"},"paragraphs":{"en":["A system can propose more candidates than it can afford to evaluate. Four patches may be cheap to generate while running large test suites takes time. A laboratory can list many conditions while only a few evaluations fit its budget. A predictor offers a forecast that can prioritize which candidates receive external feedback.","This creates an opportunity and a risk. Better ranking can spend the same feedback budget more productively. Wrong predictions can repeatedly favor a narrow, misleading region. Because observations arrive mainly for selected actions, the system does not automatically learn how accurate it is on everything it rejected. Coverage becomes part of reliability.","The paper treats external feedback and update computation as separate resources. Similar test counts establish one kind of efficiency; they do not establish equal training cost or wall-clock time. A careful comparison names the matched resource, the measured outcome, and the extra computation used for prediction, adaptation, historical re-evaluation, and acceptance."],"zh":["系统经常能提出比实际评估能力更多的候选。生成四个补丁可能便宜，运行大规模测试却需要时间；实验室可以列出很多条件，但预算只允许少量评估。预测器提供前瞻判断，帮助安排哪些候选值得获得外部反馈。","机会与风险并存。排序准确时，同样预算可能更有效；预测错误时，系统可能反复偏爱狭窄而误导性的区域。观察主要来自被选行动，因此系统并不会自动知道被拒绝候选上的准确程度。可靠性判断必须考虑覆盖范围。","论文把外部反馈与更新计算分别讨论。测试次数相近，只能说明这一类资源使用相近，不能直接推出训练成本或实际耗时相同。严谨比较应说明匹配的资源、测量的结果，以及预测、适配、历史重评估和验收还需要多少计算。"]},"takeaways":{"en":["Forecasts allocate feedback; evaluations create observations.","Selective feedback limits reliability claims.","Matched test counts do not imply matched total compute."],"zh":["预测用于分配反馈，评估产生观察。","选择性反馈限制可靠性结论。","测试次数匹配，不等于总计算量匹配。"]},"example":{"en":"Teaching example: only one of four patches can be tested. Ranking B first may save an evaluation, but executing B reveals only B’s observed outcome. A, C, and D still have forecasts.","zh":"教学例子：四个补丁只能测试一个。把 B 排第一可能节省评估，但执行 B 只揭示 B 的真实结果，A、C、D 仍只有预测。"},"notes":{"en":"Give the class four candidate patches and one test token before introducing equations. They can immediately see why selection matters. After running the chosen patch, ask what remains unknown. This reveals selective observation and prepares chapter nine’s three-state reliability assessment. Distinguish uncertainty from low utility: an uncertain candidate can be worth evaluating for information if an explicit acquisition rule enables that behavior. Also separate external interaction from internal computation. When the repair experiment later reports similar online test usage, say exactly what resource is similar. This supports a useful efficiency interpretation without making the broader, unsupported claim that every computational expense has been matched.","zh":"先给全班四个补丁和一个测试名额，再引入公式，排序价值就很直观。运行所选补丁后，追问还有什么不知道，由此引出选择性观察，为第九章的三态可靠性判断做准备。区分不确定性和低效用：若明确启用了信息获取规则，不确定候选可能值得专门评估。也要区分外部交互和内部计算。后面说在线测试次数相近时，准确指出相近的是哪种资源。这支持明确的效率解释，但并未声称每项计算成本都已匹配。"},"talk":{"en":"Suppose we have four patches but can run only one expensive test. A world model helps decide which patch deserves it. If its ranking is useful, the same test budget can produce more successful repairs. But only the executed patch supplies an observation. Rejected patches remain unobserved, limiting reliability claims. We must also distinguish feedback cost from the computation needed for prediction, adaptation, and acceptance. Similar external usage is valuable, but it is one specific resource comparison.","zh":"假设有四个补丁，却只能承担一次昂贵测试。世界模型帮助决定把机会给谁。排序有效时，同样预算可以修好更多程序。但只有被执行的补丁提供观察，未选补丁仍然未知，可靠性结论因此受到限制。还要区分外部反馈成本，与预测、适配、验收的内部计算成本。外部资源使用相近很有价值，但它是一个具体维度的比较。"},"source":{"label":"§1 · §2.3–2.4","url":"https://arxiv.org/html/2610.13912v1#S2.SS3"},"check":{"question":{"en":"After only B is tested, which observations exist?","zh":"只测试 B 以后，哪些观察真实存在？"},"options":{"en":["All four, because all were predicted","Only B has a new observed outcome","Only the highest-confidence candidate"],"zh":["四个都有，因为都预测过","只有 B 有新的观察结果","只有置信度最高的候选"]},"answer":1,"explanation":{"en":"Unexecuted candidates do not acquire observed outcomes.","zh":"未执行候选不会凭空获得观察结果。"}}},{"id":4,"slug":"jepa-foundation","part":1,"title":{"en":"Predict useful representations","zh":"预测有用的表征"},"question":{"en":"How does JEPA-Anything provide a predictive foundation?","zh":"JEPA-Anything 怎样提供预测基础？"},"summary":{"en":"Encode the state, predict an action-conditioned latent target, and read out the needed consequence.","zh":"编码状态，预测由行动条件化的潜在目标，再读出需要的后果。"},"paragraphs":{"en":["JEPA-style prediction operates in a representation space. An encoder turns the current state and domain context into a latent description. A predictor uses that description and a candidate action to forecast a target representation. A readout converts it into a usable consequence, such as execution-result probabilities or a distribution over reaction yield.","RSI-Anything inherits JEPA-Anything’s model-construction foundation. Orthogonal predictive factorization organizes latent targets into complementary factors, learns dedicated predictors, and synthesizes a complete latent state. This is predictive infrastructure. The recursive contribution studied here concerns how predictions and observed feedback are connected to updates and acceptance around the instantiated domain model.","Point and probabilistic readouts are alternative interfaces. One-step ranking only requires an outcome prediction. Multistep planning additionally requires an adapter that propagates a planning state. A yield predictor returning a scalar or distribution is therefore not automatically a simulator capable of rolling out every intermediate physical state or handling arbitrary actions."],"zh":["JEPA 式预测在表征空间中进行。编码器把状态与领域上下文变成潜在描述；预测器根据描述和候选行动，预测目标表征；读出器再把它转成可用后果，例如执行结果概率或反应产率分布。","RSI-Anything 继承 JEPA-Anything 的模型构建基础。正交预测分解把潜在目标组织为互补因素，学习专门预测器，再合成为完整潜在状态。这属于预测基础设施。本文递归机制的重点，是围绕具体领域模型，把预测与观察反馈连接到更新和验收。","点预测与概率预测是不同的输出接口。单步排序只需要结果预测，多步规划还需要能推进规划状态的适配器。因此，输出产率数值或分布的预测器，并不会自动具备逐步模拟所有中间物理状态或处理任意行动的能力。"]},"takeaways":{"en":["Latent prediction needs a task-specific readout.","OPF is inherited predictive infrastructure.","Multistep rollout requires a transition interface."],"zh":["潜在预测需要面向任务的读出。","OPF 是继承的预测基础。","多步展开需要状态转移接口。"]},"example":{"en":"Teaching analogy: summarize the program state, forecast behavior under a patch, then read out likely test outcomes. A learned representation is not a mathematical guarantee that the patch is correct.","zh":"教学类比：先概括程序状态，再预测补丁下的行为，最后读出可能的测试结果。学到的表征并不等于补丁正确性的数学保证。"},"notes":{"en":"Read the equation with three verbs: encode, predict, read out. Explain that z is a learned representation, not necessarily a human-interpretable list of facts. The action enters through a domain adapter; these symbols describe roles rather than a compulsory wiring diagram. Similar notation across domains does not imply identical weights. Explain OPF only to the extent established in this paper and direct detailed architectural questions to JEPA-Anything. Finally, check whether the interface supplies an outcome alone or also a next planning state. That determines whether imagined multistep rollouts are supported. A conceptual diagram should not silently grant transition capabilities to every predictor.","zh":"用“编码—预测—读出”三个动词讲公式。z 是学习表征，不一定是可逐项解释的事实清单。行动通过领域适配器进入预测，符号描述功能角色，并不强制同一种网络连线。跨领域使用相同符号也不代表共享权重。OPF 只讲到本文明确给出的层次，更具体的架构问题指向 JEPA-Anything。最后检查接口只给出结果，还是也能给出下一规划状态；这决定能否做多步想象展开。概念图不应悄悄替所有预测器添加状态转移能力。"},"talk":{"en":"Read this pipeline as encode, predict, and read out. The encoder summarizes the state. The predictor asks what happens under a candidate action. The readout produces the consequence the task needs. JEPA-Anything supplies the representation-prediction foundation, including factor prediction and synthesis. RSI-Anything builds the improvement loop around it. Notice the interface: an outcome prediction is enough for ranking, but multistep planning also needs a way to propagate the next planning state. The predicted future remains a forecast until checked.","zh":"把这条流水线读成编码、预测、读出。编码器概括状态，预测器回答候选行动可能带来什么，读出器给出任务需要的结果。JEPA-Anything 提供包含因素预测和合成的表征预测基础，RSI-Anything 在它周围建立改进闭环。注意接口：结果预测足以排序，但多步规划还需要推进下一规划状态的能力。 预测未来在核查前仍然只是预测。"},"source":{"label":"§2.2 · Equations 2–6","url":"https://arxiv.org/html/2610.13912v1#S2.SS2"},"formula":{"tex":"z_t=E_{\\phi}(s_t,c_d),\\quad \\widehat z_{t+1}=F_{\\phi}(z_t,a_t,c_d),\\quad \\widehat o_{t+1}=R_{\\phi}(\\widehat z_{t+1},c_d)","plain":"zₜ = Eφ(sₜ,c_d); ẑₜ₊₁ = Fφ(zₜ,aₜ,c_d); ôₜ₊₁ = Rφ(ẑₜ₊₁,c_d)","explanation":{"en":"This is the point-readout route from Equations 2–4. Equation 5 instead returns p(o | s,a,c). The domain defines utility conversion and comparison with observations.","zh":"这里是公式 2–4 的点读出路径；公式 5 则返回 p(o | s,a,c)。领域实现定义效用换算及与观察的比较。"},"symbols":[{"symbol":"s_t","en":"current task state at action step t","zh":"行动步骤 t 的当前任务状态"},{"symbol":"c_d","en":"domain context","zh":"领域上下文"},{"symbol":"a_t","en":"candidate action","zh":"候选行动"},{"symbol":"φ","en":"current domain predictor configuration","zh":"当前领域预测器配置"},{"symbol":"z / ẑ","en":"encoded state / predicted target representation","zh":"编码状态／预测目标表征"},{"symbol":"E / F / R","en":"encoder / latent predictor / outcome readout","zh":"编码器／潜在预测器／结果读出器"}]},"check":{"question":{"en":"What extra capability supports multistep planning?","zh":"什么额外能力支持多步规划？"},"options":{"en":["A larger scalar utility","An adapter that propagates planning states","A deterministic readout only"],"zh":["更大的标量效用","能推进规划状态的适配器","仅有确定性读出"]},"answer":1,"explanation":{"en":"An outcome-only predictor may rank actions without supplying future states.","zh":"只有结果输出的预测器可以排序，却未必能提供未来状态。"}}},{"id":5,"slug":"complete-loop","part":2,"title":{"en":"The complete loop: propose to retain","zh":"完整闭环：从候选到保留"},"question":{"en":"Where does feedback enter, and when does a new version become official?","zh":"反馈从哪里进入，新版本何时正式生效？"},"summary":{"en":"Six operations connect today’s decision to the system making tomorrow’s decisions.","zh":"六个操作，把当前决策与负责未来决策的系统连接起来。"},"paragraphs":{"en":["Start with an accepted policy–model pair and the task state. The policy proposes candidate actions. The model predicts consequences, while validity checks and operational constraints exclude infeasible options. A selection rule allocates the remaining feedback budget to a feasible candidate or batch. These operations decide what the system will obtain new evidence about.","Execute or evaluate the selected action and store its observation beside the prediction that motivated selection. Feedback can construct a policy or workflow revision and support a conditional predictor-adaptation attempt. These are candidate versions. Finishing an update procedure or reducing a training loss does not automatically make them the system used next.","Component checks compare proposed components with current versions. A compatibility check evaluates their assembled pair under declared conditions. An accepted pair enters the next cycle; a rejected pair leaves the previous pair in place. Retained revisions influence later proposals, rankings, feedback, and learning. This dependency closes the recursive mechanism."],"zh":["从已接受的策略—模型组合和任务状态出发。策略提出候选，模型预测后果，有效性和操作约束剔除不可行选项。选择规则把剩余反馈预算分配给一个可行候选或候选批次。这些操作决定系统接下来获得关于什么的新证据。","执行或评估所选行动，把观察与当初用于选择的预测并排保存。反馈可用于构建策略或工作流修订，也可支持有条件的预测器适配。它们仍是候选版本，更新程序运行结束或训练损失下降，并不会让它们自动成为下一轮使用的系统。","组件检查把候选组件与当前版本比较，兼容性检查在声明条件下评估组装后的组合。通过的组合进入下一周期，被拒绝时继续保留原组合。保留修订影响后续提案、排序、反馈和学习，这种依赖闭合了递归机制。"]},"takeaways":{"en":["Action selection and system acceptance are separate decisions.","Only evaluated candidates supply paired observations.","An update remains provisional until acceptance."],"zh":["行动选择和系统验收是不同决策。","只有被评估的候选提供成对观察。","更新版本通过验收前仍是候选。"]},"example":{"en":"Follow synthetic patch B through the figure: proposed → forecast → selected → tested → used to propose an update → accepted or rejected. Then trace the return arrow into the next cycle.","zh":"沿图跟踪合成补丁 B：提出→预测→选择→测试→用于提出更新→接受或拒绝。再沿返回箭头进入下一周期。"},"notes":{"en":"Use the framework figure as a map for the next five chapters. Name each operation and pause between observed feedback and candidate updates. If only B ran, ask where A’s observation is stored: it is not, because no observation exists. Explain asynchronous updates: one component can stay fixed while the other changes. Show the component checks and pair check separately. Give their purpose now and leave the fallback details for chapter ten. Trace the return arrow carefully: accepted revisions change the next actual interaction, not merely the report of the previous attempt. The six operations are a shared protocol; individual domain experiments enable different pathways.","zh":"把框架图当作后五章的地图。依次指出操作，并在观察反馈与候选更新之间停一下。如果只运行 B，A 的观察在哪里？没有，因为 A 未被观察。解释异步更新：一个组件可以固定，另一个改变。组件检查与组合检查应分别显示，这里先讲作用，第十章再讲回退细节。沿返回箭头强调：验收修订改变下一次真实交互，而不只是改变对上次尝试的总结。六个操作是共用协议，各领域实验实际启用的路径可能不同。"},"talk":{"en":"Here is our route map. Propose candidates, predict consequences, select within budget, and obtain feedback. Use that feedback to propose updates and decide what to retain. Two boundaries matter: evaluation turns a forecasted outcome into an observation, and acceptance turns a candidate update into the official version. Policy and model can change on different schedules. Follow the return arrow: the retained pair determines what the system proposes, selects, and learns about in the next cycle.","zh":"这是路线图：提出候选、预测后果、在预算内选择、获得反馈，再提出更新并决定保留哪个版本。注意两条边界：评估后才有观察，验收后候选更新才成为正式版本。策略和模型可以按不同节奏变化。沿返回箭头看，保留组合决定下一轮提出什么、选择什么，以及获得哪些新经验。"},"source":{"label":"§2 · Figure 2","url":"https://arxiv.org/html/2610.13912v1#S2"},"figure":2,"widget":"framework","check":{"question":{"en":"When does a candidate predictor become retained?","zh":"候选预测器何时成为保留版本？"},"options":{"en":["When training finishes","When it is newer","After applicable component and pair checks"],"zh":["训练完成时","版本更新时","通过适用的组件和组合检查后"]},"answer":2,"explanation":{"en":"Construction and retention are different stages.","zh":"构建更新和保留更新是不同阶段。"}}},{"id":6,"slug":"select-a-candidate","part":2,"title":{"en":"Select an action: useful, feasible, affordable","zh":"选择行动：有用、可行、付得起"},"question":{"en":"How do predicted consequences become a selection decision?","zh":"预测后果怎样变成选择决策？"},"summary":{"en":"Exclude invalid candidates, apply the declared ranking rule, then check feedback cost.","zh":"先排除无效候选，再按声明规则排序，并检查反馈成本。"},"paragraphs":{"en":["The policy produces a candidate set from the current state and goal. Each candidate receives an outcome forecast or, if supported, a bounded rollout. The verifier records validity, utility components, provenance, and any available uncertainty. Feasibility is checked before utility ranking: a promising forecast cannot override an invalid action or an operational constraint.","For the framework’s utility-based route, weighted utility components are added and an optional uncertainty penalty is subtracted. The weights, uncertainty estimator, penalty strength, batch size, and feedback costs are domain choices. The code experiment uses its own instantiated rule: it aggregates execution-class probabilities to rank four revisions before selecting one to execute.","Selecting the highest utility and selecting the most informative uncertain action are different objectives. An explicitly enabled acquisition rule may prioritize uncertainty for evaluation. The imagined-training admission filter is another decision again. A candidate can be useful to test precisely because it is uncertain, while still being unsuitable as an unverified training target."],"zh":["策略根据当前状态和目标生成候选集合。每个候选得到结果预测，或在接口支持时得到有限步展开。验证器记录有效性、效用分项、证据来源和可用的不确定性。可行性在效用排序之前检查：预测很有前景，也不能绕过无效行动或操作约束。","框架的效用排序路径把加权效用相加，再减去可选的不确定性惩罚。权重、不确定性估计器、惩罚强度、批量大小和反馈成本都由领域规定。代码实验采用具体规则：汇总执行类别概率，给四个修订排序，再选择一个执行。","选最高效用与选最有信息价值的不确定行动，目标并不相同。只有明确启用信息获取规则时，系统才可能优先评估不确定候选。想象训练数据的准入又是另一项决策：候选可能因为不确定而值得测试，却不适合直接作为未经验证的训练目标。"]},"takeaways":{"en":["Validity precedes utility ranking.","An uncertainty penalty is optional and domain-defined.","Evaluation selection and training admission have different purposes."],"zh":["有效性先于效用排序。","不确定性惩罚可选，由领域定义。","外部评估选择与训练准入用途不同。"]},"example":{"en":"Synthetic arithmetic: utility 0.80, uncertainty 0.50, penalty weight 0.20 give score 0.80−0.20×0.50=0.70. A candidate with score 0.95 but failed validity is excluded. These numbers illustrate Equation 7, not the code benchmark’s exact ranker.","zh":"合成计算：效用 0.80、不确定性 0.50、惩罚权重 0.20，得分为 0.80−0.20×0.50=0.70。即使另一个候选得分 0.95，只要有效性未通过就被排除。这些数字演示公式 7，并非代码基准的实际排序器。"},"notes":{"en":"Run the candidate-selection demonstration in two passes. First remove an invalid high-scoring option to establish that constraints are not merely soft preferences. Then vary the uncertainty weight and calculate one score aloud. Stress that this arithmetic is a teaching instantiation, while the reported code ranker aggregates execution-class probabilities. Ask why the most uncertain candidate might still deserve a real test. The answer depends on whether an information-seeking acquisition rule is enabled. This prepares the crucial distinction between learning about a candidate and learning from its imagined trajectory. Do not imply that all uncertainty estimators are calibrated or that every application uses a penalty.","zh":"演示分两遍：先剔除一个高分但无效的候选，说明约束不是软性偏好；再改变不确定性权重，现场算出一个得分。强调这只是教学实例，论文代码排序器汇总的是执行类别概率。接着问最不确定的候选为何仍可能值得真实测试：这取决于是否启用了信息获取规则。由此引出“了解一个候选”与“把它的想象轨迹拿来学习”的区别。不要暗示所有不确定性估计都经过校准，也不要说每个领域都使用惩罚项。"},"talk":{"en":"Selection has three questions. Is the candidate valid? How useful does it look under the declared rule? Can we afford its evaluation? Our toy score subtracts an optional uncertainty penalty, so changing that weight can change the ranking. The paper’s code ranker uses predicted execution probabilities instead. Also remember that uncertain does not mean worthless: an information-seeking rule may test an uncertain action, even when its imagined trajectory should not be admitted for training.","zh":"选择分三问：候选是否有效，按声明规则看有多有用，是否付得起评估成本？教学得分会减去可选的不确定性惩罚，改变权重就可能改变排序；论文代码排序器则使用执行概率。还要记住，不确定不等于没有价值。信息获取规则可能专门测试不确定行动，即使它的想象轨迹并不适合进入训练。"},"source":{"label":"§2.3 · Equation 7","url":"https://arxiv.org/html/2610.13912v1#S2.SS3"},"widget":"lab","formula":{"tex":"R_d(\\widehat\\tau)=\\sum_j w_{d,j}r_{\\tau,j}-\\Delta_d(\\widehat\\tau),\\quad \\Delta_d=\\lambda_d U(\\mathbf u_\\tau)\\ \\text{if enabled}","plain":"R_d(τ̂) = Σⱼ w_d,j r_τ,j − Δ_d(τ̂); Δ_d = λ_d U(u_τ) when enabled, otherwise 0","explanation":{"en":"Invalid candidates are removed before this score is used. If the penalty pathway is disabled, Δ=0. A declared acquisition rule can replace utility ranking; the framework does not force this formula on every domain.","zh":"无效候选先被排除。惩罚路径未启用时 Δ=0；声明的信息获取规则也可替代效用排序，框架并不强制每个领域使用此公式。"},"symbols":[{"symbol":"τ̂","en":"predicted candidate trajectory or supported outcome forecast","zh":"候选预测轨迹或所支持的结果预测"},{"symbol":"r_τ,j","en":"utility component j","zh":"第 j 项效用"},{"symbol":"w_d,j","en":"domain-specific utility weight","zh":"领域效用权重"},{"symbol":"U(u_τ)","en":"specified uncertainty estimate","zh":"指定的不确定性估计"},{"symbol":"λ_d / Δ_d","en":"penalty strength / total optional penalty","zh":"惩罚强度／可选总惩罚"}]},"check":{"question":{"en":"A candidate fails validity but has the highest utility. What happens?","zh":"候选有效性失败，但效用最高，应怎样处理？"},"options":{"en":["Execute it because utility is highest","Exclude it before ranking","Automatically train on it"],"zh":["因效用最高而执行","在排序前排除","自动拿来训练"]},"answer":1,"explanation":{"en":"Validity and operational constraints determine executable candidates before utility-based selection.","zh":"有效性和操作约束先决定哪些候选可以执行。"}}},{"id":7,"slug":"evidence-and-imagination","part":2,"title":{"en":"Keep predictions and observations separate","zh":"把预测与观察分开保存"},"question":{"en":"When may an imagined trajectory enter training?","zh":"想象轨迹什么时候可以进入训练？"},"summary":{"en":"Evidence provenance describes origin; explicit admission criteria decide sufficiency.","zh":"证据来源说明从何而来，明确准入条件才决定是否足够。"},"paragraphs":{"en":["The framework distinguishes four origins: deterministic rule checks E0, learned predictions and rollouts E1, specialized simulators or higher-fidelity calculations E2, and external measurements or experiments E3. These labels record provenance and intended fidelity. They do not make every E3 measurement correct or every E1 forecast suitable for learning.","An imagined trajectory enters a simulated learning set only when the application enables that route and its declared filters pass. These include validity, a utility threshold, an uncertainty check when enabled, and a permitted evidence source. Curating the accepted trajectories is separate from selecting real actions. If imagined learning is disabled, this set is empty.","A feedback record should preserve the input context, action, original prediction, observed result, evidence source, and generating system version. Replacing a prediction with the observed answer would erase the information needed to evaluate prediction error. Linking both fields instead allows the same experience to support action evaluation, reliability assessment, and appropriately targeted updates."],"zh":["框架区分四类来源：E0 为确定性规则检查，E1 为学习模型预测与展开，E2 为专门模拟器或更高保真计算，E3 为外部测量或实验。这些标签描述来源和预期保真度，并不保证每个 E3 测量都正确，也不意味着所有 E1 预测都可用于学习。","应用启用想象学习路径，而且声明的过滤条件全部通过时，想象轨迹才进入模拟学习集。条件包括有效性、效用阈值、启用时的不确定性检查，以及允许的证据来源。整理这些轨迹与选择真实行动是不同决定；未启用想象学习时，该数据集为空。","反馈记录应保留输入上下文、行动、原始预测、观察结果、证据来源及生成系统版本。若用真实答案覆盖预测，就会丢失评估预测误差所需的信息。把两者关联并分开保存，同一经验才能用于行动评估、可靠性判断和适当的更新。"]},"takeaways":{"en":["E0–E3 describe origins, not automatic training permission.","Imagined-learning admission is separately gated.","Keep original predictions beside observations and version identifiers."],"zh":["E0–E3 描述来源，不是自动训练许可。","想象学习有独立准入检查。","保留原始预测、观察及版本标识。"]},"example":{"en":"Teaching example: a rollout passes rules and predicts high utility but exceeds the allowed uncertainty. It is rejected as imagined training data. The system may still choose to evaluate it externally if its declared evaluation rule permits.","zh":"教学例子：一条展开通过规则且预测效用很高，但不确定性超过准入上限，因此不能进入想象训练集。若外部评估规则允许，系统仍可实际评估它。"},"notes":{"en":"Make a two-column record on screen: prediction and observation. Put a timestamp, source, and version identifier underneath. This simple display often explains the evidence contract more clearly than the indicator formula. Introduce E0 through E3 as source categories, then explain why provenance alone cannot establish correctness or suitability. Walk through one rejected imagined trajectory, showing that any failed factor makes its admission indicator zero. If the uncertainty check is omitted its factor is one, rather than pretending uncertainty has been measured. The paper specifies this general filter but does not claim that every domain trains on imagined trajectories. Preserve that optionality throughout the lesson.","zh":"在屏幕上画预测、观察两列，下方标时间、来源和版本。这通常比指示函数更容易解释证据契约。介绍 E0 到 E3 后，说明来源本身不能保证正确性或训练适用性。逐项检查一条被拒绝的想象轨迹：任一因子为零，准入结果就是零。如果没启用不确定性检查，该因子按定义取一，而不是假装已经测量不确定性。论文给出通用过滤规则，并没有说所有领域都用想象轨迹训练。教学全程都应保留这种可选性。"},"talk":{"en":"Predictions are not observations. Keep them in separate fields, linked to the same action, context, and system version. Evidence labels E0 to E3 tell us where information came from, not whether it automatically qualifies for training. Imagined trajectories need their own admission checks: validity, utility, permitted evidence, and uncertainty when enabled. Failing training admission does not necessarily prevent a real evaluation. If imagined learning is disabled, the simulated training set simply stays empty. Keep that distinction visible in every animation.","zh":"预测不是观察。应把它们分开保存，并关联同一行动、上下文与系统版本。E0 到 E3 说明信息来源，不会自动赋予训练资格。想象轨迹需要独立检查有效性、效用、允许证据及启用时的不确定性。不能进入训练，并不一定禁止真实评估。如果没有启用想象学习，模拟训练集就保持为空。 每段动画也都要清楚保留这个区别。"},"source":{"label":"§2.3 · Evidence and imagined training data · Equation 8","url":"https://arxiv.org/html/2610.13912v1#S2.SS3"},"formula":{"tex":"e_\\tau=\\mathbf1\\{v_\\tau=1\\}\\mathbf1\\{R_d(\\widehat\\tau)\\ge r_d^{\\min}\\}C_d^U(\\widehat\\tau)\\mathbf1\\{\\ell_\\tau\\in\\mathcal E_d^{train}\\}","plain":"e_τ = 1[v_τ=1] × 1[R_d(τ̂)≥r_d,min] × C_dᵁ(τ̂) × 1[ℓ_τ∈E_d,train]","explanation":{"en":"All factors must pass. Cᵁ=1 when that check is omitted. D_sim is curated from admitted trajectories only when imagined learning is enabled.","zh":"所有因子都必须通过。省略不确定性检查时 Cᵁ=1。仅在启用想象学习时，由通过的轨迹整理 D_sim。"},"symbols":[{"symbol":"e_τ","en":"binary training-admission decision","zh":"二值训练准入结果"},{"symbol":"v_τ","en":"candidate validity","zh":"候选有效性"},{"symbol":"r_d^min","en":"minimum admitted utility","zh":"准入所需最低效用"},{"symbol":"C_d^U","en":"optional uncertainty condition","zh":"可选不确定性条件"},{"symbol":"ℓ_τ / E_d^train","en":"supporting evidence label / permitted training sources","zh":"支持证据标签／允许的训练来源"}]},"check":{"question":{"en":"Does E3 provenance automatically permit training?","zh":"E3 来源是否自动允许进入训练？"},"options":{"en":["Yes, all external measurements are sufficient","No, declared admission and quality criteria still apply","Only if E1 agrees"],"zh":["是，所有外部测量都充分","否，仍需满足声明的准入和质量条件","只有 E1 同意时才可以"]},"answer":1,"explanation":{"en":"Provenance identifies origin; sufficiency is a separate assessment.","zh":"来源标明出处，充分性需要另行判断。"}}},{"id":8,"slug":"policy-or-workflow","part":2,"title":{"en":"Improve the actor or the workflow","zh":"改进策略，或改进工作流程"},"question":{"en":"What does a policy update change?","zh":"策略更新究竟改变什么？"},"summary":{"en":"Feedback must become an appropriate learning signal for the object that is allowed to change.","zh":"反馈必须转化为适合被更新对象的学习信号。"},"paragraphs":{"en":["The symbol θ can denote trainable parameters or a persistent agent workflow. A policy revision changes how candidates are generated or selected. Possible routes include demonstrations, preferences based on evaluated alternatives, and workflow search using evaluation scores. The application declares which route is enabled and which parameters or configuration fields may change.","Feedback used for policy improvement forms D_policy. Predictor adaptation uses D_adapt, which can contain different records because its target is prediction quality rather than action behavior. Imagined trajectories may supplement policy data only if that learning pathway is enabled and its admission checks have passed. One generic “feedback dataset” can hide these different objectives.","A policy-update attempt also needs a declared schedule or trigger, appropriate evidence, and enough budget. If no attempt is enabled, θ stays unchanged. When an attempt is enabled, the result is θ′, a proposed configuration. It still needs component acceptance and compatibility evaluation before becoming the retained policy for subsequent interaction."],"zh":["θ 可以代表可训练参数，也可以代表持久的智能体工作流。策略修订改变候选生成或选择方式。更新路线可以是示范学习、根据评估结果做偏好学习，或用评估分数搜索工作流。具体启用哪条路线、允许哪些参数或配置字段变化，必须由应用声明。","用于策略改进的记录组成 D_policy，用于预测器适配的记录组成 D_adapt。两者可能不同，因为一个面向行动行为，另一个面向预测质量。只有启用想象学习且轨迹通过准入时，它们才可补充策略数据。笼统地说“反馈数据集”，容易掩盖目标差别。","策略更新尝试还需要声明的计划或触发条件、合适的证据和足够预算。没启用尝试时 θ 不变；启用时得到 θ′，它仍只是候选配置。通过组件验收和兼容性评估后，才能成为后续交互使用的保留策略。"]},"takeaways":{"en":["A policy can be model parameters or a persistent workflow.","Policy and predictor datasets serve different targets.","Proposed θ′ is distinct from retained θ."],"zh":["策略可以是模型参数或持久工作流。","策略数据和预测器数据面向不同目标。","候选 θ′ 与保留 θ 不同。"]},"example":{"en":"Teaching example: feedback favors “inspect the failed assertion before proposing a patch.” Saving this as a validated workflow can revise θ even if no language-model weights change. This illustrates the framework, not a specific reported code update; the paper’s coder is fixed.","zh":"教学例子：反馈表明“先检查失败断言，再提出补丁”更有效。把它保存为通过验证的工作流，即使不改语言模型权重，也可以修订 θ。这用于说明框架，并非代码实验的具体更新；该实验代码生成器固定。"},"notes":{"en":"Use the workflow example to prevent the audience equating every update with expensive fine-tuning. Ask what configuration persists into later tasks. Then distinguish the target of the two data sets: policy learning asks which behavior should be preferred; predictor adaptation asks what outcome should have been forecast. The same interaction can support both, but their filtering and labels need not be identical. Explain the prime on θ′ as “candidate,” not “next accepted version.” The fixed-policy route is a legitimate instantiation with uπ=0. This will stop the class from incorrectly describing code repair as training the coder just because the repaired program changes across rounds.","zh":"用工作流例子避免把所有更新都等同于昂贵微调。追问什么配置会持续进入后续任务。随后区分两个数据集的目标：策略学习问应该偏好什么行为，预测器适配问本应预测出什么结果。同一交互可支持两者，但筛选和标签未必相同。θ′ 上的撇号表示候选，并不等于下一已接受版本。uπ=0 的固定策略是合法实现。这样能避免听众因为程序在多轮中变化，就误说代码修复实验训练了代码生成器。"},"talk":{"en":"A policy update can change neural parameters, but it can also change a persistent workflow. Feedback must be converted into a suitable signal: a demonstration, a preference, or a workflow score. Policy data and predictor-adaptation data need not be the same because they optimize different things. An enabled attempt produces a candidate θ′. Acceptance comes later. In a fixed-policy experiment, the update indicator is zero, even though the task state and generated candidates continue to change.","zh":"策略更新可以改神经网络参数，也可以改持久工作流。反馈要转成适当信号，例如示范、偏好或工作流分数。策略数据与预测器适配数据优化不同对象，因此不必相同。启用更新后得到的是候选 θ′，验收还在后面。固定策略实验中，更新指示为零，即使任务状态和生成候选仍在变化。"},"source":{"label":"§2.4 · Policy learning or workflow revision · Equation 9","url":"https://arxiv.org/html/2610.13912v1#S2.SS4"},"formula":{"tex":"\\theta'_{k+1}=\\begin{cases}\\operatorname{Update}(\\theta_k,\\mathcal D_{policy,k},\\mathcal D_{sim,k}),&u_k^\\pi=1\\\\ \\theta_k,&u_k^\\pi=0\\end{cases}","plain":"θ′ₖ₊₁ = Update(θₖ,D_policy,k,D_sim,k) if uₖπ=1; otherwise θₖ","explanation":{"en":"The attempt flag includes the declared trigger, sufficient evidence, and budget. Imagined data may be empty. This constructs a candidate; it does not decide retention.","zh":"尝试标志包含声明触发条件、充分证据和预算。想象数据可以为空。本式构建候选，不决定保留。"},"symbols":[{"symbol":"θ_k / θ′","en":"current / proposed policy configuration","zh":"当前／候选策略配置"},{"symbol":"u_k^π","en":"enabled policy-update attempt indicator","zh":"是否启用策略更新尝试"},{"symbol":"D_policy,k","en":"records selected for policy improvement","zh":"策略改进所选记录"},{"symbol":"D_sim,k","en":"admitted imagined trajectories, if enabled","zh":"启用时通过准入的想象轨迹"}]},"check":{"question":{"en":"Can θ change without updating neural weights?","zh":"不更新神经网络权重，θ 能改变吗？"},"options":{"en":["Yes, if an accepted persistent workflow changes","No, θ always means neural weights","Yes, merely appending any log changes θ"],"zh":["可以，验收持久工作流修订即可","不行，θ 永远表示网络权重","可以，随便追加日志就改变 θ"]},"answer":0,"explanation":{"en":"The framework allows trainable parameters or persistent workflow configurations as the policy object.","zh":"框架允许把可训练参数或持久工作流配置作为策略对象。"}}},{"id":9,"slug":"conditional-adaptation","part":2,"title":{"en":"Adapt only when the evidence warrants it","zh":"证据支持时，才尝试模型适配"},"question":{"en":"Why is “insufficient evidence” different from “reliable”?","zh":"为什么“证据不足”不等于“可靠”？"},"summary":{"en":"The adaptation trigger requires unreliability, sufficient adaptation data, and budget together.","zh":"适配触发要求：不可靠、适配数据充分、预算足够，三者同时满足。"},"paragraphs":{"en":["Reliability is assessed for the current predictor version and the relevant candidate range. Historical records must use predictions attributable to that version: either predictions already made by it or new predictions on stored inputs. Mixing old-version prediction errors directly into the current-version estimate would confuse past decision quality with present predictor quality.","The assessment has three outcomes: reliable, unreliable, or insufficient. Selected actions provide limited coverage, so a small error on a narrow observed subset is not evidence of broad reliability. Insufficient coverage yields “insufficient.” Under the formal trigger, this does not activate adaptation. Subsequent selection still follows the declared evaluation rule and remaining budget.","An adaptation attempt occurs only when reliability is classified as unreliable, the adaptation dataset is sufficient, and the available update budget covers estimated cost. The application specifies targets, predictive loss, and trainable parameters. A scalar yield supplies an outcome target, not a fully observed next state, though its loss may update trainable upstream parameters."],"zh":["可靠性针对当前预测器版本和相关候选范围评估。历史记录必须使用可归属于该版本的预测：要么是它当时生成的预测，要么是它对保存输入重新计算的预测。把旧版本误差直接混入当前估计，会混淆历史决策质量与当前预测器质量。","判断有三种结果：可靠、不可靠、证据不足。被选行动只能提供有限覆盖，因此一个狭窄观察子集上的小误差，不足以证明广泛可靠。覆盖不足应判为证据不足，按正式触发式不会启动适配；后续选择仍按声明规则及剩余预算进行。","只有判定不可靠、适配数据充分且预算能覆盖估计成本时，才尝试适配。应用还需规定监督目标、预测损失和可训练参数。单个产率数值提供的是结果目标，并非完整下一状态；若上游参数可训练，结果损失也可能更新它们。"]},"takeaways":{"en":["Use current-version predictions for current reliability.","Insufficient coverage is neither reliability nor an adaptation trigger.","Adaptation needs all three conditions and remains provisional."],"zh":["当前可靠性要使用当前版本预测。","覆盖不足既不是可靠，也不触发适配。","适配须满足三个条件，结果仍待验收。"]},"example":{"en":"Synthetic gate: unreliable + 12 usable records + enough budget may enable an attempt under a teaching rule. Changing the verdict to insufficient turns the attempt off. The number 12 is illustrative; the paper does not specify a universal minimum.","zh":"合成门控：在教学规则下，不可靠、12 条可用记录、预算足够，可能允许尝试；把判断改为证据不足，就不触发。12 仅是示例，论文没有规定通用最少样本数。"},"notes":{"en":"Demonstrate all three reliability states rather than reducing the check to a red/green switch. Start with insufficient coverage and show that adaptation remains off, even if budget is abundant. Next use an unreliable verdict but insufficient adaptation data. Finally satisfy all conditions. Explain the version rule using an old predictor and a revised one: old stored predictions can explain past decisions, but current reliability needs current-version predictions. The data threshold, loss, and trainable subset are application specifications, so the toy interface must label its settings synthetic. A triggered attempt does not guarantee improvement; the candidate predictor still faces component and compatibility checks.","zh":"演示三态判断，不要简化成红绿二选一。先设覆盖不足，即使预算充足也不启动；再设不可靠但适配数据不足；最后让三个条件同时满足。用旧预测器和修订预测器说明版本规则：旧预测可以解释历史决策，当前可靠性却需要当前版本预测。数据阈值、损失和可训练范围由应用规定，教学界面的设置必须标成合成。触发尝试也不保证提高，候选预测器后面仍需通过组件与兼容性检查。"},"talk":{"en":"The reliability verdict has three states. Reliable means the declared checks pass over covered candidates. Unreliable can justify adaptation. Insufficient means we lack enough coverage; it is not a certificate of reliability and it does not activate this trigger. An attempt additionally requires enough suitable data and budget. Use predictions attributable to the current model version when judging it. Even when all conditions pass, adaptation only proposes a new predictor. Retention is a separate decision.","zh":"可靠性有三种状态。可靠表示在覆盖范围内通过声明检查；不可靠可以支持适配；证据不足说明覆盖不够，既不是可靠证明，也不激活这个触发器。适配还要有足够合适数据和预算。评估当前模型时，要用属于当前版本的预测。即使条件全部通过，适配也只是提出新预测器，能否保留仍是另一项决策。"},"source":{"label":"§2.4 · Equations 10–12","url":"https://arxiv.org/html/2610.13912v1#S2.SS4"},"widget":"lab","formula":{"tex":"u_k^W=\\mathbf1\\{\\rho_k^W=\\mathrm{unreliable}\\}\\mathbf1\\{\\mathcal D_{adapt,k}\\ \\mathrm{sufficient}\\}\\mathbf1\\{B_{update,k}\\ge\\widehat c_{adapt,k}\\}","plain":"uₖᵂ = 1[ρₖᵂ=unreliable] × 1[D_adapt,k sufficient] × 1[B_update,k≥ĉ_adapt,k]","explanation":{"en":"The reliability assessment can also return reliable or insufficient; both leave this attempt flag at zero. A disabled adaptation pathway also sets uᵂ=0.","zh":"可靠性也可返回可靠或证据不足，这两种情况均令尝试标志为零。适配路径未启用时同样 uᵂ=0。"},"symbols":[{"symbol":"u_k^W","en":"world-model adaptation attempt indicator","zh":"世界模型适配尝试指示"},{"symbol":"ρ_k^W","en":"current-version reliability verdict","zh":"当前版本可靠性判断"},{"symbol":"D_adapt,k","en":"selected adaptation records","zh":"所选适配记录"},{"symbol":"B_update,k","en":"remaining budget for the proposed attempt","zh":"本次尝试可用剩余预算"},{"symbol":"ĉ_adapt,k","en":"estimated adaptation cost in matching units","zh":"相同单位的适配成本估计"}]},"check":{"question":{"en":"Coverage is insufficient, but data and budget look plentiful. Does Equation 11 trigger?","zh":"覆盖不足，但数据和预算看起来很多，公式 11 是否触发？"},"options":{"en":["Yes, plentiful budget is sufficient","No, the reliability verdict must be unreliable","Yes, insufficient means unreliable"],"zh":["是，预算充足就行","否，可靠性必须判为不可靠","是，证据不足就是不可靠"]},"answer":1,"explanation":{"en":"Insufficient is a distinct state and does not satisfy the unreliability indicator.","zh":"证据不足是独立状态，不满足“不可靠”指示条件。"}}},{"id":10,"slug":"retain-a-pair","part":2,"title":{"en":"A better component can make a worse pair","zh":"组件更好，组合仍可能更差"},"question":{"en":"Why check compatibility after checking each component?","zh":"单独检查组件后，为什么还要检查兼容性？"},"summary":{"en":"Accept revisions at the level of the assembled decision system, with explicit fallback rules.","zh":"对组装后的决策系统进行验收，并明确失败时回退到哪里。"},"paragraphs":{"en":["A policy component check measures its declared task utility and constraints against the current policy. A model component check measures relevant predictive quality against the current model. Passed, attempted components enter an assembled candidate pair; a failed or unattempted component contributes its old version. This determines exactly which pair will face compatibility evaluation.","The pair check addresses interaction: a policy can propose unfamiliar candidates, and a predictor can alter selection or learning signals. Evaluate the assembled system against the current pair under prescribed matched conditions. Matched task conditions do not require identical generated candidates. The check concerns joint decision behavior and prediction suitability on the selected policy’s candidate range.","If the pair check fails, the entire old pair is retained. If neither component changes, the current pair carries forward without a new pair comparison. Update data construct candidates; gate data choose retained versions; a designated held-out audit set supports final reporting. Reusing a gate for many choices can still motivate an independent final audit."],"zh":["策略组件检查把声明的任务效用和约束与当前策略比较，模型组件检查把相关预测质量与当前模型比较。已尝试且通过的组件进入候选组合；未尝试或失败的组件使用旧版本。这样先明确究竟是哪一对版本要进入兼容性评估。","组合检查处理相互影响：策略可能提出陌生候选，预测器可能改变选择或学习信号。在规定且匹配的条件下，将组装系统与当前组合比较。任务条件匹配不要求生成完全相同候选；检查关注联合决策行为，以及预测器对所选策略候选范围的适用性。","组合检查失败时，整个旧组合被保留；如果两个组件都没变化，就无需重新比较组合。更新数据用于构建候选，门控数据用于挑选保留版本，指定的留出审计集用于最终报告。若门控被反复用于挑选，也更需要独立最终审计。"]},"takeaways":{"en":["Component checks compare each proposal with its current version.","Compatibility evaluates the assembled pair.","Pair failure retains the entire old pair."],"zh":["组件检查分别与当前版本比较。","兼容性检查评估组装后的组合。","组合失败时，保留整个旧组合。"]},"example":{"en":"Synthetic example: a new predictor lowers average error, but ranks patches from the new policy poorly. Both may pass separate checks, yet fail the pair check. The retained system is the old pair, not an untested mixture chosen after failure.","zh":"合成例子：新预测器平均误差更小，但对新策略提出的补丁排序很差。它们可能各自通过检查，却在组合检查中失败。此时保留旧组合，不是失败后临时挑一个未测试的混合组合。"},"notes":{"en":"Work through two cases on the diagram. In the first, the policy component fails but the model passes: the assembled pair is old policy plus proposed model, and that pair must pass compatibility. In the second, both components pass but their pair fails: Equation 18 retains the entire old pair. Do not invent an automatic search through every possible mixture after pair failure. Explain why improving average prediction error is insufficient if error concentrates on candidates favored by the new policy. Then distinguish training, gate selection, and held-out reporting. These roles control what each performance number can legitimately establish and help students recognize repeated-selection bias.","zh":"在图上走两个案例。第一，策略组件失败、模型通过，组装成旧策略加候选模型，这个组合仍要接受兼容性检查。第二，两个组件分别通过但组合失败，公式 18 保留整个旧组合。不要发明组合失败后自动搜索所有混搭的流程。说明平均预测误差下降为何仍可能不够：如果误差恰好集中在新策略偏爱的候选上，联合表现仍会受损。最后区分训练、门控选择与留出报告，这些数据角色决定性能数字究竟能证明什么，也帮助理解反复挑选带来的偏差。"},"talk":{"en":"A component can improve in isolation yet damage joint behavior. The new policy might propose unfamiliar actions; the new model might rank them poorly. Component checks first decide which proposed versions enter the candidate pair. The pair check then compares that assembled system with the current pair. If it fails, the whole old pair stays. If neither component changes, no new pair comparison is needed. Keep update data, gate data, and final audit data conceptually separate. Acceptance criteria must be declared before inspecting the outcome.","zh":"组件单独变好，联合行为仍可能变差。新策略可能提出陌生行动，新模型可能把它们排错。先由组件检查决定哪些候选版本进入组合，再由组合检查与当前系统比较。组合失败时，整个旧组合继续保留；若两个组件都未变化，就不必重新比较组合。最后记住更新数据、门控数据和最终审计数据的不同作用。 验收标准应在检查结果之前声明。"},"source":{"label":"§2.5 · Equations 13–18","url":"https://arxiv.org/html/2610.13912v1#S2.SS5"},"widget":"lab","formula":{"tex":"(\\theta_{k+1},\\phi_{d,k+1})=\\begin{cases}(\\bar\\theta_{k+1},\\bar\\phi_{d,k+1}),&G_k^{pair}=1\\\\(\\theta_k,\\phi_{d,k}),&G_k^{pair}=0\\end{cases}","plain":"(θₖ₊₁,φ_d,k+1) = (θ̄ₖ₊₁,φ̄_d,k+1) if G_pair=1; otherwise (θₖ,φ_d,k)","explanation":{"en":"Bars identify the candidate components after component checks. Each attempted component enters only if its own gate passes; otherwise its current version is used. Equation 18 then makes the pair-level decision.","zh":"横线表示经过组件检查后的候选组件；只有尝试且通过各自检查的组件才进入，否则使用当前版本。公式 18 再做组合层面的决定。"},"symbols":[{"symbol":"θ_k / φ_d,k","en":"current policy / current predictor","zh":"当前策略／当前预测器"},{"symbol":"θ̄ / φ̄","en":"assembled components after component acceptance","zh":"组件验收后组装的组件"},{"symbol":"G_k^pair","en":"compatibility acceptance decision","zh":"兼容性验收结果"},{"symbol":"k+1","en":"next cycle’s retained version, possibly unchanged","zh":"下一周期保留版本，可能不变"}]},"check":{"question":{"en":"Both proposed components pass, but their pair fails. What is retained?","zh":"两个候选组件单独通过，但组合失败，保留什么？"},"options":{"en":["Both new components","The entire old pair","An arbitrary old/new mixture"],"zh":["两个新组件","整个旧组合","随意一个新旧混合"]},"answer":1,"explanation":{"en":"Equation 18 falls back to the entire current pair when pair acceptance fails.","zh":"公式 18 在组合验收失败时回退到整个当前组合。"}}},{"id":11,"slug":"repair-design","part":3,"title":{"en":"Code repair: hold the coder fixed","zh":"代码修复：把代码生成器固定住"},"question":{"en":"What does this comparison isolate?","zh":"这一比较究竟隔离了什么因素？"},"summary":{"en":"A shared coder and candidate budget separate the value of selection from the value of predictor adaptation.","zh":"共用代码生成器和候选预算，区分选择方式与预测器适配的价值。"},"paragraphs":{"en":["The policy is ReasonFlux-Coder-7B and remains fixed. In each repair round it proposes four revisions, and one is chosen for execution. W1, a 3B execution-outcome predictor adapted from Qwen2.5-Coder-3B-Instruct with LoRA and the JEPA-Anything
