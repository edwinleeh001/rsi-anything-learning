 design, returns five-class probabilities for each candidate–test pair. These probabilities are aggregated to rank revisions.","The core comparison uses 200 CodeContests tasks, three seeds, and at most three feedback rounds. Random selection, a capacity-matched static verifier, a fixed world model, and a feedback-adapted world model share the coder and candidate budget. Online tests provide repair feedback; hidden tests determine final all-pass success. These are different evaluation roles.","The official repository adds an important implementation detail beyond the paper’s high-level feedback loop. Its reproduction guide documents a four-stage adaptation training chain on recorded transitions. The final benchmark evaluation performs no optimizer updates. Comparing fixed and adapted checkpoints therefore does not mean that the released final evaluation performs online gradient descent during each of the 600 episodes.","The classroom repair laboratory illustrates prediction, feedback, conditional adaptation, and retention with small synthetic examples. It does not load ReasonFlux, W1, or the benchmark checkpoints, and it is not a literal replay of the released training chain. Its purpose is to reveal decision logic while keeping reported research results in a separate evidence panel."],"zh":["策略是固定的 ReasonFlux-Coder-7B。每轮提出四个修订，只选一个执行。W1 是 3B 执行结果预测器，以 Qwen2.5-Coder-3B-Instruct、LoRA 和 JEPA-Anything 设计构建；它为候选—测试对输出五类概率，再汇总排序修订。","核心比较使用 200 道 CodeContests 任务、三个随机种子、最多三轮反馈。随机选择、容量匹配静态验证器、固定世界模型和反馈适配世界模型，共用代码生成器和候选预算。在线测试提供修复反馈，隐藏测试决定最终全通过成功率，两者用途不同。","官方仓库给出超出论文高层闭环描述的重要实现细节：复现指南说明，适配是在已记录转移上进行的四阶段训练链，最终基准评估不执行优化器更新。因此，比较固定与适配检查点，不意味着发布的最终评估会在 600 次任务—种子评估中逐次在线梯度下降。","本站修复实验台使用小型合成例子，讲解预测、反馈、条件适配和保留，不加载 ReasonFlux、W1 或基准检查点，也不是发布训练链的逐条重放。目的是揭示决策逻辑；论文研究结果放在独立证据面板中。"]},"takeaways":{"en":["The coder stays fixed while the predictor configuration differs.","Online feedback and hidden final evaluation have distinct roles.","Repository final evaluation uses fixed checkpoints without optimizer updates."],"zh":["代码生成器固定，预测器配置不同。","在线反馈与隐藏最终评估用途不同。","仓库最终评估使用固定检查点，不做优化器更新。"]},"example":{"en":"Teaching example: the same generator offers A–D to two selectors. If their choices differ, this can demonstrate a selector effect. If their generators also differ, candidate quality becomes another possible explanation.","zh":"教学例子：同一生成器把 A–D 交给两个选择器。选择不同可以说明选择器的作用；若生成器也不同，候选质量就成为另一个可能解释。"},"notes":{"en":"Begin by circling the fixed coder label. Students often hear “repair improves” and assume the code generator was trained. Here the program changes, but the coder remains fixed. Explain the four-candidate, one-execution protocol and the separation of online and hidden tests. Then explicitly distinguish the paper’s general adaptation pathway from the released reproduction procedure: recorded-transition training produces the adapted checkpoint, and final evaluation does not optimize it online. This is a repository-backed detail, not a newly inferred experimental result. The synthetic laboratory may visualize an update within a cycle for teaching, but must not be described as a timing-faithful reproduction of those benchmark episodes.","zh":"先圈出固定代码生成器标签。听到修复成功率提高时，学生容易误以为代码生成器接受了训练；这里程序改变，但代码生成器固定。解释四选一执行及在线、隐藏测试分工。随后明确区分论文一般适配路径与仓库发布流程：记录转移用于训练适配检查点，最终评估不会在线优化。该细节来自官方复现指南，不是新推断的实验结论。教学实验台可以在周期内可视化一次更新，但不能说它忠实重现了基准评估中的更新时序。"},"talk":{"en":"Code repair gives us a relatively controlled comparison. The same fixed coder proposes four revisions, then a selector chooses one to execute. Online tests guide repair; hidden tests measure final success. Compare a static verifier, a fixed predictor, and an adapted predictor. One implementation detail matters: the official reproduction guide trains adaptation on recorded transitions, and final evaluation does not run optimizer updates. Our small interactive loop explains the protocol, rather than reproducing that benchmark training procedure.","zh":"代码修复提供较受控的比较：同一个固定代码生成器提出四个修订，选择器挑一个执行。在线测试指导修复，隐藏测试测最终成功。我们比较静态验证器、固定预测器和适配预测器。注意实现细节：官方指南在记录转移上训练适配，最终评估不运行优化器更新。交互小实验解释协议，并不复现该基准训练流程。"},"source":{"label":"§3.1 · §6.1 · Table 4; repository reproduction guide","url":"https://arxiv.org/html/2610.13912v1#S3.SS1"},"figure":3,"check":{"question":{"en":"Which object is fixed in the central repair comparison?","zh":"核心修复比较中，哪个对象固定？"},"options":{"en":["The repaired program","ReasonFlux-Coder-7B","Every world-model checkpoint"],"zh":["被修复程序","ReasonFlux-Coder-7B","所有世界模型检查点"]},"answer":1,"explanation":{"en":"Programs and feedback evolve, but the coder is held fixed while selection and predictor settings are compared.","zh":"程序与反馈变化，代码生成器固定，用于比较选择和预测器设置。"}}},{"id":12,"slug":"repair-results","part":3,"title":{"en":"Read the repair gains carefully","zh":"仔细阅读修复增益"},"question":{"en":"Do better forecasts translate into more successful repairs?","zh":"更好的预测，是否对应更多成功修复？"},"summary":{"en":"The results show successive gains from predictive selection and predictor adaptation at similar online test usage.","zh":"结果显示：预测选择与预测器适配带来连续增益，在线测试使用相近。"},"paragraphs":{"en":["Table 2 reports hidden all-pass rates of 26.0% for Random-K, 26.3% for the static verifier, 29.2% for the fixed world model, and 31.2% for the adapted world model. Their mean online suite calls per task are 3.72, 3.72, 3.71, and 3.72. The comparison concerns similar external test usage, not identical overall computation.","For the fixed-world-model versus static-verifier comparison, ranking accuracy increases from 66.5% to 72.8% and five-class Brier score falls from 0.488 to 0.358. Ranking accuracy asks whether candidates are ordered well. Brier score measures probabilistic prediction error. These diagnostics connect forecasting quality with final repair success, but are different metrics.","The paper gives a paired gain of +2.83 percentage points for fixed world model versus static verifier, with a 95% interval of [+0.17,+5.50]. Subtracting rounded displayed rates gives 2.9 points; that rounded subtraction is not the same numerical quantity as the reported paired estimate. An adaptive-model Brier score is not supplied in Figure 3c.","Additional evaluations report 46.37% on APPS Introductory and 33.05% on LiveCodeBench v6 for JEPA-Anything-guided selection, averaged across three seeds. These extend evidence about selection across coding benchmarks. They do not establish that both policy and predictor continuously improve together, because the coder remains fixed in these reported comparisons."],"zh":["表 2 的隐藏全通过率分别是：随机选择 26.0%、静态验证器 26.3%、固定世界模型 29.2%、适配世界模型 31.2%。每任务平均在线测试套件调用为 3.72、3.72、3.71、3.72。这里比较的是相近的外部测试用量，不是完全相同的总体计算。","固定世界模型相对静态验证器，排序准确率从 66.5% 升到 72.8%，五类 Brier 分数从 0.488 降到 0.358。排序准确率问候选次序是否正确，Brier 分数衡量概率预测误差。这些诊断把预测质量与修复成功联系起来，但它们是不同指标。","论文报告固定世界模型相对静态验证器的配对增益为 +2.83 个百分点，95% 区间为 [+0.17,+5.50]。直接减去四舍五入后的展示成功率，会得到 2.9 点；不能把这个近似差值冒充报告的精确配对估计。图 3c 没有提供适配模型的 Brier 分数。","补充评估中，JEPA-Anything 引导选择在 APPS Introductory 和 LiveCodeBench v6 上，三种子平均成功率为 46.37% 和 33.05%。它们扩展了跨编码基准的选择证据，但不能建立策略与预测器持续共同提高的结论，因为这些比较中的代码生成器仍固定。"]},"takeaways":{"en":["26.3 → 29.2 → 31.2% supports two successive comparisons.","Brier and ranking diagnostics compare static verifier with fixed WM.","Keep exact paired estimates separate from rounded rate subtraction."],"zh":["26.3→29.2→31.2% 支持两个连续比较。","Brier 与排序诊断比较的是静态验证器和固定模型。","区分精确配对估计与四舍五入数值的相减。"]},"example":{"en":"Metric illustration: forecasting five classes as probabilities incurs Brier loss against the observed one-hot class. A confident wrong forecast is penalized more than a mildly uncertain wrong one. This illustrates the standard metric, not a recomputation of the paper’s results.","zh":"指标示意：五类概率与真实类别独热向量比较，得到 Brier 损失。非常自信但错误的预测，比温和不确定的错误预测受罚更重。这解释标准指标，并非重新计算论文结果。"},"notes":{"en":"Read the table in two comparisons. First compare static verifier with fixed world model; then compare fixed with adapted world model. Keep the fixed coder and candidate budget visible. Explain why hidden success, ranking accuracy, and Brier score answer different questions. Identify precisely which systems have reported predictive diagnostics. When discussing uncertainty, use the paper’s paired estimate and interval rather than creating an interval for the adaptive gain. Tasks recur across seeds, so the paper uses task-level resampling for clustered inference. Finally separate matched online test use from total computational cost. We have transcribed the results and inspected the evidence; we have not independently run these models or re-estimated their statistics.","zh":"分两步读表：先比较静态验证器与固定世界模型，再比较固定与适配世界模型。固定代码生成器和候选预算始终可见。解释隐藏成功率、排序准确率、Brier 分数分别回答什么，指出哪些系统有预测诊断。讨论不确定性时使用论文给出的配对估计和区间，不替适配增益发明区间。同一任务跨种子重复，因此论文按任务重采样做聚类推断。最后区分在线测试匹配与总计算成本。我们核对并转录结果，没有独立运行模型或重估统计。"},"talk":{"en":"Read these as two successive comparisons. Predictive selection raises hidden success from 26.3 to 29.2%, and predictor adaptation reaches 31.2%, with similar online test usage. Better ranking and lower Brier error are reported for the fixed model versus the static verifier. The exact paired gain is 2.83 percentage points, with its reported interval; rounded table subtraction gives 2.9. These results support selection and adaptation, while the fixed coder limits claims about joint policy–model improvement.","zh":"把结果读成两个连续比较：预测选择把隐藏成功率从 26.3% 提到 29.2%，预测器适配再达到 31.2%，在线测试用量相近。排序与 Brier 改善报告的是固定模型相对静态验证器。精确配对增益是 2.83 个百分点，附有区间；展示率直接相减是约 2.9。这支持选择与适配，但固定代码生成器限制了对策略—模型共同提高的推断。"},"source":{"label":"§3.1 · Table 2 · §6.2","url":"https://arxiv.org/html/2610.13912v1#S3.SS1"},"widget":"evidence","formula":{"tex":"\\operatorname{Brier}=\\frac1N\\sum_{i=1}^{N}\\sum_{c=1}^{5}(p_{ic}-y_{ic})^2","plain":"Brier = (1/N) Σᵢ₌₁ᴺ Σ_c₌₁⁵ (pᵢc − yᵢc)²","explanation":{"en":"This is the standard explanatory definition of the five-class Brier metric, not a numbered equation introduced by the paper. Lower is better. The site does not recompute the reported values.","zh":"这是解释五类 Brier 指标的标准定义，不是论文另行编号提出的公式。越低越好，本站没有重算报告值。"},"symbols":[{"symbol":"N","en":"number of evaluated predictions","zh":"评估预测数量"},{"symbol":"p_ic","en":"predicted probability of class c for example i","zh":"样例 i 属于类别 c 的预测概率"},{"symbol":"y_ic","en":"1 for the observed class, otherwise 0","zh":"真实类别为 1，其他为 0"},{"symbol":"c=1…5","en":"the five execution-result classes","zh":"五个执行结果类别"}]},"check":{"question":{"en":"What does similar online suite usage establish?","zh":"在线套件调用相近能说明什么？"},"options":{"en":["Identical training cost","Similar external test usage in this comparison","Identical latency and hardware"],"zh":["训练成本完全相同","本比较外部测试使用相近","延迟和硬件完全相同"]},"answer":1,"explanation":{"en":"Prediction, adaptation, and acceptance computation are additional resource dimensions.","zh":"预测、适配和验收计算属于其他资源维度。"}}},{"id":13,"slug":"gui-feedback","part":3,"title":{"en":"GUI: success, errors, and relative gains","zh":"GUI：成功、错误与相对增益"},"question":{"en":"Do fewer actions always mean a better agent?","zh":"动作更少，一定代表智能体更好吗？"},"summary":{"en":"Task completion and error diagnostics must be read together; controller attribution needs implementation context.","zh":"任务完成与错误诊断要一起读；控制器归因还需实现背景。"},"paragraphs":{"en":["On MiniWoB++ click-checkboxes, the reported RSI-Anything configurations reach 51%, 79%, and 99% success. Average actions change from 5.30 to 2.93 to 3.21. The middle configuration uses the fewest actions but has 21 incorrect-submission episodes, compared with 9 initially and 1 finally. Minimizing actions alone would select the wrong trade-off.","Repeated clicks fall from 237 initially to 0 finally. The final configuration combines high success with fewer actions than baseline and fewer submission errors. The paper reports policy and world-model updates through interaction feedback. It also reports a world-based control with success of 49%, 96%, and 98% across the corresponding configurations.","The official GUI results guide adds an attribution caveat: the development-selected controller uses alpha=0 and follows policy ranking, while pure world-based control ranks the same policy candidates by world-model values. The 99% endpoint therefore does not isolate a causal contribution from world-model ranking. Framework-level descriptions and this particular selected controller should be distinguished.","OSWorld uses relative improvement: RSI-Anything is +18.4% versus the initial agent and +5.5% versus RLAnything; RLAnything is +12.3% versus the initial agent. These are relative percentages, not percentage points. The absolute initial success rate is not supplied here, so the absolute endpoint cannot be recovered from these figures alone."],"zh":["MiniWoB++ 复选框任务中，RSI-Anything 三种配置成功率为 51%、79%、99%，平均动作为 5.30、2.93、3.21。中间配置动作最少，却有 21 个错误提交回合；初始为 9，最终为 1。因此只追求动作少，会选错权衡。","重复点击从初始 237 次降到最终 0 次。最终配置同时实现高成功率、比基线更少的动作和更少的提交错误。论文报告策略与世界模型通过交互反馈更新，也给出世界模型控制器对应的 49%、96%、98% 成功率。","官方 GUI 结果指南补充了归因限制：开发集选出的控制器 alpha=0，跟随策略排序；纯世界模型控制器则用模型数值排序相同的策略候选。因此，99% 端点不能单独隔离世界模型排序的因果贡献。框架层描述与具体选中控制器应区分。","OSWorld 报告的是相对改进：RSI-Anything 相对初始智能体 +18.4%，相对 RLAnything +5.5%；RLAnything 相对初始 +12.3%。这些是相对百分比，不是百分点。这里没有给出初始绝对成功率，因此不能只凭这些数字还原绝对端点。"]},"takeaways":{"en":["Fewer actions can coexist with more incorrect submissions.","99% selected-controller success does not isolate WM ranking.","OSWorld gains are relative percentages."],"zh":["动作更少，也可能错误提交更多。","99% 选中控制器成功率不能隔离模型排序作用。","OSWorld 增益使用相对百分比。"]},"example":{"en":"Synthetic unit example: if initial success were 40%, an 18.4% relative improvement would be 40%×1.184=47.36%, a 7.36-percentage-point gain. The 40% starting value is invented for teaching, not the OSWorld baseline.","zh":"合成单位例子：若初始成功率是 40%，相对提高 18.4% 后为 40%×1.184=47.36%，增加 7.36 个百分点。40% 只是教学设定，不是 OSWorld 基线。"},"notes":{"en":"Ask students to choose between the middle and final checkbox configurations using actions alone, then reveal the incorrect submissions. This makes multi-metric evaluation concrete. Clarify that diagnostics are not interchangeable: repeated clicks, incorrect episodes, and task success count different things. Introduce the official repository controller detail as additional implementation evidence. It narrows attribution without erasing the reported performance. Explain alpha=0 in plain language as following policy ranking; no internal blending derivation is needed. For OSWorld, calculate one hypothetical relative gain and label the starting value synthetic. Never convert +18.4% into +18.4 percentage points or invent an absolute success endpoint. Ask students to name the comparator before interpreting any gain.","zh":"先只给动作数，让学生选择中间或最终配置，再展示错误提交，具体说明多指标评估。重复点击、错误回合和任务成功率统计的对象不同。把官方仓库控制器细节作为额外实现证据介绍：它限制归因，但并不抹去已报告表现。alpha=0 用“跟随策略排序”解释即可，无须推导内部混合规则。OSWorld 用假设初始率计算相对增益，并清楚标注为合成。不要把 +18.4% 写成 +18.4 个百分点，也不要发明绝对成功率端点。 解读任何增益前，先让学生说清参照对象。"},"talk":{"en":"The checkbox task shows why action count is not enough. The middle configuration takes only 2.93 actions but has more incorrect submissions; the final one takes 3.21 and reaches 99% success. The repository says this selected controller follows policy ranking, so 99% does not isolate world-model ranking. On OSWorld, the gains are relative percentages. An 18.4% relative gain multiplies the baseline by 1.184; it does not add 18.4 percentage points.","zh":"复选框任务说明动作数不够：中间配置只有 2.93 个动作，但错误提交更多；最终配置 3.21 个动作，成功率 99%。仓库说明选中控制器跟随策略排序，因此 99% 不能单独归因于世界模型排序。OSWorld 增益是相对百分比，18.4% 相对提高意味着基线乘 1.184，不是增加 18.4 个百分点。"},"source":{"label":"§3.2 · Figure 4 · §6.1; official GUI RESULTS.md","url":"https://arxiv.org/html/2610.13912v1#S3.SS2"},"figure":4,"formula":{"tex":"\\operatorname{RelativeGain}=100\\left(\\frac{s_{method}}{s_{reference}}-1\\right)\\%","plain":"Relative gain = 100 × (s_method / s_reference − 1)%","explanation":{"en":"A percentage-point difference instead subtracts success rates expressed in percent. These answer different questions.","zh":"百分点差直接减去以百分数表示的成功率，两种单位回答不同问题。"},"symbols":[{"symbol":"s_method","en":"method success rate","zh":"方法成功率"},{"symbol":"s_reference","en":"reference success rate","zh":"参照成功率"}]},"check":{"question":{"en":"Does +18.4% relative improvement mean +18.4 percentage points?","zh":"相对提高 18.4% 是否就是增加 18.4 个百分点？"},"options":{"en":["Yes","No; it multiplies the baseline by 1.184","Only for OSWorld"],"zh":["是","否，它把基线乘以 1.184","只有 OSWorld 是"]},"answer":1,"explanation":{"en":"An absolute baseline is needed to compute the percentage-point difference.","zh":"计算百分点差需要知道绝对基线。"}}},{"id":14,"slug":"laboratory-planning","part":3,"title":{"en":"Five planning versions, one benchmark","zh":"五个规划版本，同一基准"},"question":{"en":"What does the laboratory progression demonstrate?","zh":"实验室版本递进说明了什么？"},"summary":{"en":"Successive retained policies improve protocol-aligned planning; physical execution is a separate evaluation.","zh":"连续保留的策略提升了协议一致规划；物理执行需要单独评估。"},"paragraphs":{"en":["LabHorizon examines laboratory planning under reagent, instrument, and ordering constraints. Level 1 measures visually grounded next-action accuracy. Level 2 measures protocol-aligned action sequences, with a Final Score combining action-sequence similarity and parameter accuracy. The reported F200 setting contains 200 tasks. This score is not a rate of successful physical experiments.","The paper follows five consecutive versions of the same 4B policy in one development sequence. Their Level-2 scores are 21.80%, 38.03%, 41.99%, 44.56%, and 46.01%. The final-minus-initial difference is 24.21 percentage points. The plot’s horizontal spacing is schematic development order, not elapsed training time or equal update cost.","The final version scores 46.01% versus 45.32% for the Actor–Simulator–Selector reference, a difference of 0.69 percentage points. Level-1 accuracy is 0.700 versus 0.665. These are reported benchmark means; the paper supplies no uncertainty interval establishing statistical significance for that 0.69-point difference. Model size alone also does not determine total system cost.","This experiment provides evidence for successive retained policy improvement in planning. It does not by itself establish continuous reciprocal improvement of policy and world model. The framework diagram includes broader update routes, while the quantitative series follows policy versions. Reliable execution on real equipment, with its interfaces and failure modes, remains an additional validation requirement."],"zh":["LabHorizon 评估受试剂、仪器和顺序约束的实验室规划。一级衡量视觉支持的下一行动准确率；二级衡量协议一致的行动序列，Final Score 结合序列相似度与参数准确性。F200 有 200 个任务，这个分数不是物理实验成功率。","论文跟踪一次开发序列中同一 4B 策略的五个连续版本。二级分数依次为 21.80%、38.03%、41.99%、44.56%、46.01%，首尾相差 24.21 个百分点。图中横向距离是示意的开发顺序，并非实际训练时间或相同更新成本。","最终版本 46.01%，Actor–Simulator–Selector 参照为 45.32%，差 0.69 个百分点；一级准确率为 0.700 对 0.665。它们是报告的基准均值，论文没有提供证明 0.69 点达到统计显著性的区间。模型参数量本身也不能代表系统总成本。","本实验支持连续保留策略在规划上的改进，但不能单独建立策略与世界模型持续相互提高的结论。框架图包含更广的更新路径，量化曲线实际跟踪的是策略版本。真实设备的接口和失败模式，仍需要额外执行验证。"]},"takeaways":{"en":["F200 Final Score measures planning alignment.","Five policy versions improve from 21.80 to 46.01%.","A 0.69-point mean advantage has no supplied significance interval."],"zh":["F200 Final Score 衡量规划一致性。","五个策略版本从 21.80% 提高到 46.01%。","0.69 点均值优势未附显著性区间。"]},"example":{"en":"Teaching example: a plan may list the right steps but use an incorrect duration or reagent amount. A score combining sequence and parameter quality can reflect both. It still cannot prove that a robot executed the plan safely or successfully.","zh":"教学例子：计划步骤正确，却使用错误时长或试剂用量。结合序列与参数的分数可以反映两方面，但不能证明机器人已经安全、成功地执行。"},"notes":{"en":"Read the five points as versions of one policy, not five independent model families. State the benchmark and metric before quoting the improvement. Ask what Final Score measures and what observation would be needed to establish physical execution. Explain the diminishing increments without inferring a general learning law from only five selected points. The 4B label describes the planning policy, while the reference is a multi-component Actor–Simulator–Selector system; avoid turning that into an unsupported total-cost ratio. Finally, distinguish the 24.21-point within-process progression from the 0.69-point reference comparison. They answer different questions and have different evidence strength. Ask students to name the comparator before interpreting any gain.","zh":"把五个点读成同一策略的版本，而非五种独立模型。先说明基准和指标，再引用增益。问 Final Score 测什么，还需要哪些观察才能证明物理执行。可以观察增量变小，但不能凭五个被评估点推导普遍学习规律。4B 描述规划策略，参照是包含多个组件的 Actor–Simulator–Selector，不能据此发明系统总成本倍数。最后区分 24.21 点的过程内递进与 0.69 点的外部参照比较，两者问题与证据强度不同。 解读任何增益前，先让学生说清参照对象。"},"talk":{"en":"The lab result follows five versions of one 4B policy on the same 200-task planning benchmark. Final Score rises from 21.80 to 46.01%, a 24.21-point gain. The final score is 0.69 points above the reference, without a supplied interval for that difference. Remember the metric: it combines action-sequence and parameter alignment. This supports successive planning improvement, while real equipment execution and sustained joint policy–model improvement require further evidence. Planning alignment and execution success answer different questions.","zh":"实验室结果在同一 200 任务规划基准上跟踪一个 4B 策略的五个版本，Final Score 从 21.80% 到 46.01%，提高 24.21 点。最终比参照高 0.69 点，但没有给出该差值区间。记住，指标结合序列与参数一致性。它支持连续规划改进，真实设备执行及持续策略—模型共同提高，还需要额外证据。 规划一致性和执行成功回答的是不同问题。"},"source":{"label":"§3.3 · Figure 5 · Table 3","url":"https://arxiv.org/html/2610.13912v1#S3.SS3"},"figure":5,"check":{"question":{"en":"What does 46.01% describe?","zh":"46.01% 描述什么？"},"options":{"en":["Physical laboratory execution success","Mean F200 Level-2 protocol-aligned planning score","World-model calibration accuracy"],"zh":["真实实验室执行成功率","F200 二级协议一致规划平均分","世界模型校准准确率"]},"answer":1,"explanation":{"en":"Final Score combines sequence similarity and parameter accuracy.","zh":"Final Score 结合序列相似度和参数准确性。"}}},{"id":15,"slug":"reaction-optimization","part":3,"title":{"en":"Chemistry: compare within each screen","zh":"化学：在各自筛选协议内比较"},"question":{"en":"How much can feedback-guided search achieve within a fixed observation budget?","zh":"固定观察预算内，反馈引导搜索能达到什么结果？"},"summary":{"en":"Two separate measured-yield screens support budgeted selection; the released flow evaluation is frozen-model pool replay.","zh":"两个独立实测产率筛选支持预算选择；发布的流动评估是固定模型的候选池重放。"},"paragraphs":{"en":["The paper studies two Suzuki–Miyaura screens, comparing RSI-Anything with Bayesian optimization inside each protocol. In the GC-analyzed Pd–NHC–DMS screen, the best observed yield after 20 evaluations is 93.0% versus 87.5%, a 5.5-percentage-point difference. This is one screen with its own reaction, choices, and measurement method.","In the separate flow LC–MS screen using Pd(OAc)2, mean best observed yield after 40 evaluations is 96.15% versus 82.16%, a 13.99-point difference. Do not splice the two screens into a single trajectory or average their endpoints. “Best observed” is a running maximum, so its curve cannot decrease even when the newest observation is worse.","The official reaction-optimization guide describes the released flow evaluation as sequential replay over a fixed pool of 321 measured conditions, with 100 runs and eight initial observations included within the total budget of 40. Predictions remain frozen. Feedback changes expected-improvement selection and removes already observed candidates rather than updating neural weights at every observation.","This implementation detail narrows the claim: it is a reproducible feedback-guided selection experiment over measured data. It is not evidence that the released inference loop performs a fresh wet-lab experiment after every choice. More general physical deployment or transfer to different chemistry would need evaluation beyond the reported pools, protocols, and budgets."],"zh":["论文研究两个 Suzuki–Miyaura 筛选协议，在各自协议内比较 RSI-Anything 与贝叶斯优化。GC 分析的 Pd–NHC–DMS 筛选中，20 次评估后最佳已观察产率为 93.0% 对 87.5%，相差 5.5 个百分点。这是具有独立反应、选项和测量方法的一组筛选。","另一组使用 Pd(OAc)2 的流动 LC–MS 筛选中，40 次评估后的平均最佳已观察产率为 96.15% 对 82.16%，相差 13.99 点。两组不能拼成一条轨迹，也不应平均端点。“最佳已观察”是历史最大值，即使新观察变差，曲线也不会下降。","官方反应优化指南说明，发布的流动评估是在固定的 321 个已测条件池中进行顺序重放，运行 100 次；八个初始观察计入总共 40 的预算。预测保持冻结，反馈改变期望改进选择，并移除已观察候选，而非每次观察后更新神经网络权重。","这一实现细节限定了结论：它是基于实测数据、可复现的反馈引导选择实验，不能据此说发布推理循环每次选择后都会开展一个全新湿实验。更一般的物理部署和向其他化学体系迁移，需要超出已报告候选池、协议和预算的评估。"]},"takeaways":{"en":["GC: 20 observations, 93.0 vs 87.5%.","Flow: 40 observations, 96.15 vs 82.16%.","Released flow replay uses frozen predictions over a measured pool."],"zh":["GC：20 次观察，93.0% 对 87.5%。","流动筛选：40 次观察，96.15% 对 82.16%。","发布的流动重放在实测池上使用冻结预测。"]},"example":{"en":"Teaching example: yields 40, 80, 55 give best-so-far values 40, 80, 80. The flat final segment does not mean the third condition achieved 80; it means the best previously observed condition remains 80.","zh":"教学例子：产率 40、80、55，对应历史最佳 40、80、80。末段持平不代表第三个条件达到 80，而是先前最佳仍为 80。"},"notes":{"en":"Start by separating the two screens on the page. Read each endpoint together with its method and budget. Explain a running maximum using three invented yields, because monotonic curves can otherwise look like guaranteed improvement at every step. Then introduce the repository-backed implementation scope: 321 measured candidates, eight initial observations inside forty, one hundred runs, frozen predictions, and history-dependent expected-improvement selection. Feedback can change decisions without changing model weights. These details prevent conflating replay with a continuously adapting physical laboratory. The paper’s broad selection contract remains useful, while the released evaluation supports a narrower, precisely describable empirical claim. Ask students to name the comparator before interpreting any gain.","zh":"先把两组筛选在页面上分开，连同方法和预算一起读端点。用三个虚构产率解释历史最大值，否则单调曲线容易被误读为每一步都更好。随后说明仓库实现范围：321 个实测候选，八个初始观察计入四十次，一百次运行，预测冻结，期望改进选择依赖反馈历史。反馈能够改变决策而不改变模型权重。这避免把重放混成持续适配的实体实验室。论文通用选择契约仍有价值，但发布评估支持的是范围更窄、可准确描述的实证结论。 解读任何增益前，先让学生说清参照对象。"},"talk":{"en":"There are two chemistry screens. At twenty observations, the GC screen reaches 93.0 versus 87.5%. At forty, the separate flow screen reaches 96.15 versus 82.16%. Both measure best-so-far yield. The released flow evaluation replays a fixed pool of measured conditions with frozen predictions; feedback changes the next selection. This supports budgeted sequential search, while it does not show a new physical experiment or neural weight update at every step of that released loop.","zh":"化学部分有两组筛选：GC 在二十次观察后为 93.0% 对 87.5%；另一组流动筛选在四十次后为 96.15% 对 82.16%。指标都是历史最佳产率。发布的流动评估重放固定实测条件池，预测冻结，反馈改变后续选择。它支持预算下的顺序搜索，但不代表发布循环每步都开展全新实体实验或神经权重更新。"},"source":{"label":"§3.4 · Figure 6 · §6.1; official reaction guide","url":"https://arxiv.org/html/2610.13912v1#S3.SS4"},"figure":6,"check":{"question":{"en":"Why can a best-so-far curve stay flat after a poor observation?","zh":"新观察很差，历史最佳曲线为什么仍可持平？"},"options":{"en":["The poor result is secretly improved","The metric retains the largest earlier observation","Every condition has the same yield"],"zh":["差结果被暗中提高","指标保留先前观察中的最大值","所有条件产率相同"]},"answer":1,"explanation":{"en":"The running maximum records the best value seen, not the latest yield.","zh":"历史最大值记录见过的最佳值，而非最新产率。"}}},{"id":16,"slug":"immune-science","part":3,"title":{"en":"Immune science: construction versus analysis","zh":"免疫科学：构建与分析分阶段"},"question":{"en":"Which parts improve, and which predictor stays frozen?","zh":"哪些部分发生改进，哪个预测器保持冻结？"},"summary":{"en":"Workflow evolution constructs a model; downstream self-correcting analysis uses its fixed parameters.","zh":"工作流演化构建模型；下游自我纠正分析使用固定模型参数。"},"paragraphs":{"en":["The construction stage uses Agent Genesis to search scientific-agent workflows and model configurations. The selected model-building workflow is retained and produces an action-conditioned immune world model. This establishes a persistent workflow and a resulting predictor. It should be distinguished from the later analysis stage, which uses the constructed model rather than continually retraining it.","The model represents cellular states, tissue immune context, and individual context. Explicit actions include cytokines, genetic perturbations, or candidate therapies. Its readouts support forecasting and interpretation across these scales. Measured perturbation evidence supports development; withheld interventions and biological contexts assess forecasting and action composition. These are predictive evaluations, not direct proof of therapeutic benefit.","During downstream analysis, world-model parameters are frozen while analysis state, candidate interventions, tool use, and hypothesis ranking can evolve. The analysis agent coordinates inference, evaluation, and self-correction. Revising a hypothesis is therefore not the same as adapting the underlying world model. The stage distinction is essential when mapping this application onto the general framework.","The paper reports that self-correction removed screened cytokine-pair candidates, and integrated evidence led to a prospective nomination combining SIRPα inhibition with IL-36γ-axis modulation. This is a concrete hypothesis for subsequent experimental testing. Its appearance at the end of an end-to-end workflow does not establish validated efficacy, clinical suitability, or completed therapeutic experimentation."],"zh":["构建阶段使用 Agent Genesis 搜索科学智能体工作流和模型配置，保留选中的模型构建工作流，并产出行动条件化的免疫世界模型。这里留下了持久工作流与所得预测器。要与后续分析阶段区分：后者使用构建好的模型，而非不断重新训练。","模型表示细胞状态、组织免疫上下文和个体上下文；显式行动包括细胞因子、遗传扰动或候选疗法。读出支持跨尺度预测与解释。实测扰动证据支持开发，留出干预和生物背景用于评估预测与行动组合。这些是预测评估，不直接证明治疗获益。","下游分析时，世界模型参数冻结，但分析状态、候选干预、工具使用和假设排序可以变化。分析智能体协调推理、评估与自我纠正。因此，修改假设不等于适配底层世界模型。把此应用对应到通用框架时，阶段区分非常重要。","论文报告自我纠正剔除了筛选的细胞因子对候选，整合证据后提出 SIRPα 抑制与 IL-36γ 轴调节的前瞻组合。这是供后续实验检验的具体假设。工作流端到端产出它，并不等于已经证明疗效、临床适用性或完成治疗实验。"]},"takeaways":{"en":["Construction retains a workflow and its resulting model.","Downstream predictor parameters stay frozen.","The therapeutic nomination awaits experimental testing."],"zh":["构建阶段保留工作流及所得模型。","下游预测器参数保持冻结。","治疗方向提名仍待实验检验。"]},"example":{"en":"Teaching distinction: deleting a poorly supported candidate from the hypothesis list changes analysis state. Updating model weights to better predict a held-out intervention would change the predictor. The reported downstream analysis does the former while keeping predictor parameters fixed.","zh":"教学区分：从假设表删除证据薄弱候选，改变的是分析状态；为更准预测留出干预而更新模型权重，改变的是预测器。报告的下游分析进行前一类修订，同时固定预测器参数。"},"notes":{"en":"Draw a vertical boundary between construction and downstream analysis. On the left, a retained model-building workflow produces the immune predictor. On the right, candidate interventions and hypotheses change while the predictor is frozen. Ask which object each arrow modifies. Explain the three biological scales as input and prediction contexts, without implying a fully mechanistic simulator of every immune process. Read the therapeutic endpoint using prospective language. The paper cites a separate immune-world-model study for detailed development and evaluation. Our lesson summarizes this application’s role in RSI-Anything; it neither independently validates that model nor turns the nomination into a treatment recommendation.","zh":"在构建与下游分析间画清晰分界。左侧由保留的模型构建工作流产出免疫预测器；右侧候选干预和假设变化，预测器冻结。逐条问箭头修改哪个对象。三种生物尺度作为输入与预测背景解释，不要暗示已经完整机制模拟所有免疫过程。治疗端点使用前瞻措辞。论文引用另一篇免疫世界模型研究提供开发与评估细节。本课总结它在 RSI-Anything 中的角色，没有独立验证模型，更不会把假设提名当作治疗建议。"},"talk":{"en":"Separate construction from analysis. First, workflow search selects and retains a model-building workflow that produces the immune world model. Then an analysis agent uses that model with frozen parameters, revising interventions and hypotheses through evidence and self-correction. The final SIRPα and IL-36γ combination is a prospective nomination for testing. It is a useful concrete output, while the evidence does not establish a validated therapy or continual predictor retraining during downstream analysis.","zh":"先区分构建与分析：工作流搜索选中并保留模型构建流程，产出免疫世界模型；随后分析智能体使用参数冻结的模型，根据证据与自我纠正修订干预和假设。最终 SIRPα 与 IL-36γ 组合是待检验的前瞻提名。它是具体产出，但证据没有建立已验证疗法，也没有说明下游分析持续重训预测器。"},"source":{"label":"§3.5 · Figure 7 · §6.1","url":"https://arxiv.org/html/2610.13912v1#S3.SS5"},"figure":7,"check":{"question":{"en":"What stays fixed in downstream immune analysis?","zh":"下游免疫分析中什么保持固定？"},"options":{"en":["All hypotheses","World-model parameters","The analysis state"],"zh":["所有假设","世界模型参数","分析状态"]},"answer":1,"explanation":{"en":"Hypotheses and analysis can change while the constructed predictor’s parameters remain frozen.","zh":"假设与分析可以变化，构建好的预测器参数保持冻结。"}}},{"id":17,"slug":"limits-of-evidence","part":4,"title":{"en":"One framework, several evidence scopes","zh":"一个框架，多种证据范围"},"question":{"en":"What has the paper established, and what remains open?","zh":"论文已经建立什么，哪些问题仍然开放？"},"summary":{"en":"Cross-domain reuse of a mechanism is different from sustained mutual improvement within one task.","zh":"机制的跨领域复用，与单个任务中持续相互促进，是不同命题。"},"paragraphs":{"en":["Read Table 4 before making a broad claim. Code repair fixes the coder and compares selection plus predictor adaptation. Laboratory planning follows successive policy versions. GUI reports updates to both components, with controller-specific attribution caveats. Chemistry evaluates feedback-guided choices; the released flow replay freezes predictions. Immune science separates construction from frozen-model downstream analysis.","These are complementary demonstrations of a common mechanism, not interchangeable proofs of every pathway. The discussion explicitly says joint multiround evaluation is needed to establish sustained mutual improvement of policy and world model within a single task. No number of different domains automatically supplies that missing longitudinal comparison or proves unrestricted recursive improvement.","Other limits are domain-specific. Planning alignment needs equipment-level execution validation; chemistry is bounded by the reported screens and budgets; a therapeutic nomination awaits experimentation. Reliability conclusions are also bounded by observed candidate coverage. A strong reading preserves these boundaries while recognizing evidence for predictive selection, predictor adaptation, policy progression, and measured-feedback search."],"zh":["广泛下结论前先读表 4：代码固定代码生成器，比较选择和预测器适配；实验室跟踪策略版本；GUI 报告双组件更新，但有控制器归因限制；化学评估反馈选择，发布的流动重放冻结预测；免疫把构建与下游固定模型分析分开。","这些是共用机制的互补展示，不是每条路径的可互换证明。讨论明确指出，要建立同一任务内策略与世界模型的持续相互促进，还需要联合多轮评估。领域再多，也不会自动补上这项纵向比较，更不能证明不受限制的递归提高。","其他边界依领域而异：规划一致性需要设备执行验证，化学受已报告筛选与预算限制，治疗提名等待实验。可靠性结论还受观察候选覆盖约束。好的解读既保留边界，也承认预测选择、预测器适配、策略递进和实测反馈搜索的证据。"]},"takeaways":{"en":["Domain generality is reuse of the improvement procedure.","Sustained coupled improvement needs joint multiround evidence.","Evaluate each claim against its actual update scope."],"zh":["领域通用性指改进流程的复用。","持续耦合提高需要联合多轮证据。","每项结论都要对应实际更新范围。"]},"example":{"en":"Evidence exercise: “A fixed coder plus an improved predictor raises repair success” is supported in its reported setting. “Every domain updates both components every round” is not. “Any future policy remains covered by the current reliability test” is also not supported.","zh":"证据练习：“固定代码生成器配合改进预测器提高修复成功率”在报告设置中有支持；“每个领域每轮都更新两个组件”没有；“当前可靠性检查覆盖任何未来策略”同样没有支持。"},"notes":{"en":"Show the update-scope matrix and ask students to name the changed object in each row. This consolidates the entire lesson. Read the discussion’s coupled-evaluation limitation in your own words and distinguish absence of evidence from evidence of impossibility. The paper offers useful mechanisms and results; the missing joint longitudinal study is a research opportunity, not a reason to discard all findings. Emphasize two levels of qualification: empirical scope across applications and local reliability scope over covered candidates. Both matter because a model can look good on selected observations while a new policy moves into unmeasured regions. Preserve the difference between author claims, implementation details, and our proposed follow-up tests.","zh":"展示更新范围矩阵，请学生逐行说出改变对象。用自己的话解释讨论中的联合评估限制，并区分“没有足够证据”与“不可能实现”。论文提供了有用机制和结果，缺少纵向联合研究是研究机会，不代表所有发现无效。强调两层限定：应用实验的经验范围，以及可靠性判断对已覆盖候选的局部范围。新策略可能走向未测区域，所以两层都重要。继续区分作者论文、仓库实现细节和本课提出的后续测试。"},"talk":{"en":"The evidence is strongest when we match each claim to its experiment. Code supports selection and predictor adaptation; lab results support policy progression; chemistry supports budgeted search. These do not combine automatically into proof of sustained mutual improvement inside one task. The authors explicitly call for joint multiround evaluation. Keep the useful contribution and the open question together: a reusable improvement protocol has empirical support, while its strongest long-term coupled claim still needs a dedicated test.","zh":"证据要与实验逐项对应：代码支持选择和预测器适配，实验室支持策略递进，化学支持预算搜索。它们不会自动合成单个任务内持续相互提高的证明。作者明确要求联合多轮评估。应同时保留贡献与问题：可复用改进协议已有经验支持，而最强的长期耦合命题仍需专门检验。"},"source":{"label":"§5 Discussion · Table 4","url":"https://arxiv.org/html/2610.13912v1#S5"},"widget":"evidence","check":{"question":{"en":"Which conclusion requires further joint multiround evaluation?","zh":"哪个结论还需要联合多轮评估？"},"options":{"en":["Predictive selection can help reported code repair","Sustained mutual policy–model improvement within one task","Five reported lab versions have increasing scores"],"zh":["预测选择能帮助报告的代码修复","单一任务内策略—模型持续相互提高","五个实验室版本分数递增"]},"answer":1,"explanation":{"en":"The paper explicitly identifies this longitudinal coupled claim as requiring further evidence.","zh":"论文明确指出这项纵向耦合结论需要更多证据。"}}},{"id":18,"slug":"compare-mechanisms","part":4,"title":{"en":"Where does this sit among learning methods?","zh":"它在已有学习方法中处于什么位置？"},"question":{"en":"How is the loop different from reflection, planning, or self-training alone?","zh":"它与单独的反思、规划或自训练有何不同？"},"summary":{"en":"The distinction is a combination of predictive choice, feedback-driven revision, and accepted policy–model retention.","zh":"区别在于把预测选择、反馈修订和策略—模型验收保留组合起来。"},"paragraphs":{"en":["Within-task reflection uses feedback to revise an answer or action. It can help immediately, but it is not necessarily a persistent policy revision. Self-training and preference learning can make persistent updates, yet they do not automatically provide a world model that forecasts action consequences or an explicit test of policy–predictor compatibility.","World-model planning evaluates possible futures before acting. That supplies the prospective selection capability. A fixed planning system, however, need not revise or retain either component from new evidence. RSI-Anything’s protocol explicitly connects forecasts to observations, observations to candidate revisions, and revisions to acceptance decisions that determine the next round’s system.","The paper builds on existing work rather than claiming to invent prediction, verification, or feedback learning individually. Its organizing emphasis is the coupled policy–model system, version-aware reliability, conditional adaptation, and compatibility-aware retention. The instantiated algorithms remain domain-specific. A fair comparison asks which object changes, what evidence drives it, and what is retained."],"zh":["任务内反思利用反馈修改答案或行动，可能立即有用，但不一定产生持久策略修订。自训练和偏好学习能做持久更新，却不会自动提供预测行动后果的世界模型，也不自动包含策略—预测器兼容性检查。","世界模型规划在行动前评估可能未来，提供前瞻选择能力。但固定规划系统未必根据新证据修订或保留任何组件。RSI-Anything 明确连接预测与观察、观察与候选修订，以及决定下一轮系统的验收决策。","本文建立在已有研究上，并不声称单独发明预测、验证或反馈学习。其组织重点是耦合策略—模型系统、版本感知可靠性、条件适配和考虑兼容性的保留。具体算法仍由领域决定。公平比较应问改变什么、由什么证据驱动、最终保留什么。"]},"takeaways":{"en":["Reflection can change an answer without changing the actor.","Planning can use a predictor without adapting it.","The protocol organizes the connection and acceptance of these capabilities."],"zh":["反思可以改答案而不改行动系统。","规划可以用预测器而不适配它。","该协议组织这些能力间的连接与验收。"]},"example":{"en":"Comparison exercise: take a planner that always uses the same policy and model. Adding a longer search horizon changes inference. Adding a validated new policy version changes the retained system. These are different experimental interventions.","zh":"比较练习：一个始终使用相同策略和模型的规划器，增加搜索深度改变的是推理；加入通过验证的新策略版本，改变的是保留系统。它们属于不同实验干预。"},"notes":{"en":"Keep this comparison conceptual rather than building a leaderboard of unrelated methods. Use three columns: object changed, evidence used, and retained artifact. Place within-task reflection, persistent policy learning, fixed world-model planning, and the complete RSI-Anything protocol in those columns. Methods can overlap, so avoid absolute claims that one family never uses a component. The paper’s related-work section provides examples, but our teaching distinction is functional. Ask the audience to identify the extra machinery needed to turn a planner into a retained improvement loop. Their answer should include prediction–observation records, update rules, version-aware reliability, component checks, and pair acceptance. Ask students to name the comparator before interpreting any gain.","zh":"做机制比较，不做无关方法排行榜。使用三列：改变对象、所用证据、保留产物，把任务内反思、持久策略学习、固定世界模型规划和完整协议放进去。方法之间可能重叠，不要绝对地说某类从不使用某组件。论文相关工作提供例子，本课区分依据是功能。请听众说明把规划器变成保留改进闭环还需要什么，答案应包含预测—观察记录、更新规则、版本可靠性、组件检查和组合验收。 解读任何增益前，先让学生说清参照对象。"},"talk":{"en":"Reflection, learning, and planning contribute different capabilities. Reflection can revise the current answer. Policy learning can persist a behavioral change. A world model can forecast consequences before execution. RSI-Anything organizes these around feedback records and acceptance rules for a policy–model pair. Its contribution is the connection, not the invention of every component. To compare methods fairly, ask what changes, which evidence justifies the change, and what configuration survives into later decisions.","zh":"反思、学习和规划提供不同能力：反思改当前答案，策略学习保留行为变化，世界模型提前预测后果。RSI-Anything 用反馈记录与验收规则，把这些能力围绕策略—模型组合组织起来。贡献在于连接，而不是发明每个组件。公平比较时，问改变什么、什么证据支持改变、哪个配置进入后续决策。"},"source":{"label":"§4 Related Work · §5","url":"https://arxiv.org/html/2610.13912v1#S4"},"check":{"question":{"en":"A fixed planner searches deeper with the same policy and model. What changes?","zh":"固定规划器使用同一策略和模型搜索更深，改变什么？"},"options":{"en":["Inference effort, without necessarily revising the retained system","Automatically both neural models","The acceptance thresholds must change"],"zh":["推理投入，不一定修订保留系统","自动改变两个神经模型","验收阈值必须变化"]},"answer":0,"explanation":{"en":"More inference and accepted system revision are distinct interventions.","zh":"增加推理与验收系统修订是不同干预。"}}},{"id":19,"slug":"next-experiment","part":4,"title":{"en":"Design the missing coupled experiment","zh":"设计缺少的耦合实验"},"question":{"en":"What experiment would test sustained mutual improvement?","zh":"什么实验能检验持续相互促进？"},"summary":{"en":"A proposed study should follow both components over repeated cycles, under matched resources and independent audits.","zh":"建议研究应在匹配资源和独立审计下，跨周期跟踪两个组件。"},"paragraphs":{"en":["Proposed follow-up, not a reported result: choose one task family and run four controlled routes—neither component updates, policy only, model only, and both. Keep objectives, interfaces, candidate allowances, acceptance rules, and resource definitions fixed. Follow accepted versions across multiple cycles and evaluate on later tasks, rather than comparing only an initial and final checkpoint.","Add ablations of conditional adaptation and compatibility retention while measuring the cost of their checks. Record current-version prediction quality on the current policy’s candidate distribution, observed coverage, selected actions, rejected updates, and resource usage. Component performance and joint decision performance should both be reported. A failed proposed update is informative and should not disappear from the log.","Use update data for candidate construction, gate data for selection, and a protected audit stream for final conclusions. Account for repeated choices and recurring tasks when estimating uncertainty. Examine novel candidate regions and distribution shifts explicitly. If joint gains disappear when observations or computation are matched, that result would constrain the mechanism’s claimed advantage rather than merely lowering a headline score."],"zh":["以下是后续研究建议，不是论文结果：选择同一任务族，运行四条受控路线——均不更新、只更新策略、只更新模型、两者都更新。固定目标、接口、候选配额、验收规则和资源定义。跨多个周期跟踪保留版本，在后续任务上评估，而非只比较首尾检查点。","再消融条件适配和兼容性保留，同时测量检查成本。记录当前模型在当前策略候选分布上的预测质量、观察覆盖、所选行动、被拒更新与资源使用。组件性能与联合决策性能都要报告。失败更新也有信息，不应从日志中消失。","更新数据构建候选，门控数据做选择，受保护的审计数据支持最终结论。估计不确定性时考虑反复选择和重复任务，明确检查新候选区域与分布变化。若匹配观察或计算后联合收益消失，这会约束机制优势，而不只是降低一个展示分数。"]},"takeaways":{"en":["This chapter proposes tests; it does not add paper results.","Track both component trajectories and joint behavior.","Include failed updates, coverage, and all relevant costs."],"zh":["本章提出测试，并未增加论文实测结果。","同时跟踪组件轨迹与联合行为。","纳入失败更新、覆盖及相关成本。"]},"example":{"en":"Proposed diagnostic: a policy improves on familiar actions but moves into a new action region. Audit prediction quality in that region before crediting the joint system with reliable improvement. No universal audit threshold is assumed here.","zh":"建议诊断：策略在熟悉行动上提高，却进入新行动区域。将联合系统称为可靠提高前，先审计新区域的预测质量。这里不假设存在通用审计阈值。"},"notes":{"en":"Signal the change in evidence status before discussing this chapter: these are our research proposals inspired by the paper’s stated limitations. Walk through the four routes and ask what confound each controls. Joint updates may consume more computation, so measuring only external observations can be insufficient for one question while still appropriate for another. Decide the comparison question first. Explain why independent audits matter when gate data repeatedly select versions. Also log no-change cycles and rejected revisions; otherwise a smooth selected-version curve can hide expensive failures. The goal is to determine when coupling helps and where it breaks, not to assume improvement in advance.","zh":"本章开始先声明证据状态变化：这是根据论文局限提出的研究设计。逐项解释四条路线分别控制什么混杂。联合更新可能耗费更多计算，某些问题只匹配外部观察不够，但另一些问题这样匹配仍合理，应先决定比较问题。解释门控数据反复挑选版本时，独立审计为何重要。也要记录未改变周期和被拒修订，否则漂亮的保留版本曲线可能隐藏昂贵失败。目标是识别耦合何时有帮助、哪里会失败，而不是先假定一定提高。"},"talk":{"en":"Here is a proposed next study. In one task family, compare no updates, policy-only updates, model-only updates, and joint updates across repeated cycles. Track predictive quality on the candidates the current policy actually proposes, alongside joint task performance. Match clearly defined resources and include checking costs. Keep a protected audit stream and log rejected updates too. This would test when coupling produces sustained benefits, rather than assuming that separate component improvements must combine successfully. Our proposal is a study design, not a paper result.","zh":"下面是后续研究建议：在同一任务族，跨周期比较不更新、只更新策略、只更新模型和联合更新。既跟踪当前策略候选上的预测质量，也跟踪联合任务表现。匹配明确的资源，并计入检查成本；保护审计数据，记录被拒更新。这样才能检验耦合何时产生持续收益，而不是预设组件各自提高就必然组合成功。 这是研究设计建议，并非论文结果。"},"source":{"label":"Motivated by §5 Discussion; proposed study","url":"https://arxiv.org/html/2610.13912v1#S5"},"check":{"question":{"en":"Which design best tests the coupled claim?","zh":"哪个设计最适合检验耦合命题？"},"options":{"en":["One final score from unrelated domains","Joint multicycle tracking with controlled update routes and independent audits","A larger framework illustration"],"zh":["不同领域各取一个最终分","受控更新路线、独立审计与联合多周期跟踪","更大的框架示意图"]},"answer":1,"explanation":{"en":"The claim concerns interaction and persistence over time, so the design must observe both.","zh":"该命题涉及长期相互作用与持续性，设计需同时观察两者。"}}},{"id":20,"slug":"teach-it-back","part":4,"title":{"en":"Teach the loop back in six verbs","zh":"用六个动词复述闭环"},"question":{"en":"Can you explain the mechanism, evidence, and limits without the diagram?","zh":"离开框架图，你能解释机制、证据与边界吗？"},"summary":{"en":"Propose, predict, select, observe, revise, retain—and keep the evidence status of every statement clear.","zh":"提出、预测、选择、观察、修订、保留，并说明每个判断的证据状态。"},"paragraphs":{"en":["Reconstruct one cycle aloud. Start with an accepted pair, propose feasible actions, predict consequences, and allocate the feedback budget. Observe only what is actually evaluated. Use feedback to construct appropriate candidate updates, with conditional model adaptation. Apply component checks and pair acceptance, then carry the retained pair and linked history into the next cycle.","Explain the paper with three evidence distinctions. Reported results are the authors’ benchmark observations. The site’s toy patches, arithmetic, and animated gate choices are educational synthesis. The coupled evaluation design is a proposed follow-up. The official repository supplies additional implementation details, including recorded-transition adaptation, frozen measured-pool replay, and selected-controller attribution.","For a roughly 30-minute presentation, allow about five minutes for foundations, eleven for the method including interaction, nine for evidence, and five for limits and discussion. The concise talk track is a scaffold; detailed notes support preparation and questions. Three short clips revisit the loop, feedback selection, and acceptance. Pause or step the interactive demonstration when explaining a decision."],"zh":["口头重建一个周期：从已接受组合出发，提出可行行动，预测后果，分配反馈预算；只有实际评估才有观察。利用反馈构建适当候选更新，其中模型适配有条件；再做组件与组合验收，将保留组合及关联历史带入下一周期。","用三种证据状态解释论文：报告结果是作者基准观察；本站小补丁、计算与门控动画是教学合成；联合评估设计是后续建议。官方仓库提供额外实现细节，包括记录转移适配、冻结的实测池重放，以及选中控制器归因。","约三十分钟主讲可分配：基础五分钟，含互动的方法十一分钟，证据九分钟，边界讨论五分钟。精简口播提供主线，详细讲稿用于准备与问答。三段短片回顾闭环、反馈选择和验收。解释每项决策时，可暂停或单步操作演示。"]},"takeaways":{"en":["Explain what changes, what is observed, and what is retained.","Tie every empirical claim to the correct experiment.","Separate paper findings, repository detail, teaching examples, and proposals."],"zh":["说清改变什么、观察什么、保留什么。","把每个经验结论对应到正确实验。","区分论文、仓库细节、教学例子与研究建议。"]},"example":{"en":"Teach-back task: explain why a lower-error predictor might be rejected, why an untested patch has no observed outcome, and why 96.15% best yield is not a success rate for unrestricted chemistry. Give one sentence for each.","zh":"复述练习：分别用一句话解释，低误差预测器为何仍会被拒；未测试补丁为何没有观察结果；96.15% 最佳产率为何不是任意化学任务的成功率。"},"notes":{"en":"Use the final chapter for retrieval practice rather than reading another summary. Hide the framework and ask the audience to name the six operations. Then reveal the figure and ask where an observation is created, where adaptation is triggered, and where a proposed version is accepted. Replay one clip only if it resolves a missed dependency. Invite a final evidence classification: benchmark result, repository implementation detail, synthetic example, or proposed study. The thirty-minute schedule includes explanation, pauses, figure inspection, interactions, and questions; it is not a claim that the short script takes thirty minutes when read verbatim. Encourage independent source checking through the per-chapter references and evidence audit.","zh":"把末章用于主动回忆，而不是再读一遍总结。先隐藏框架，让听众说出六个操作；再揭示图，指出观察在哪里产生、适配在哪里触发、候选版本在哪里被接受。只有需要修正漏掉的依赖时才重播短片。最后把陈述分类为基准结果、仓库实现、合成示例或研究建议。三十分钟包含解释、停顿、看图、互动和讨论，不是声称精简讲稿逐字朗读正好三十分钟。鼓励通过章节来源与证据审计独立核查。"},"talk":{"en":"Explain the loop in six verbs: propose, predict, select, observe, revise, retain. Always say which object changes and which evidence supports the change. Then state the evidence carefully: predictive selection and adapted predictors help reported repair tasks, successive policies improve planning, and measured-feedback search improves screen-specific endpoints. Sustained mutual policy–model improvement remains a dedicated evaluation question. Finally, distinguish the paper’s findings from repository details, our synthetic demonstrations, and proposed follow-up experiments. That evidence discipline is part of understanding the method.","zh":"用六个动词解释闭环：提出、预测、选择、观察、修订、保留。始终说清改变哪个对象、证据来自哪里。实验要准确表述：预测选择和适配预测器帮助报告的修复任务，连续策略提升规划，实测反馈搜索改善特定筛选端点。持续策略—模型相互提高仍需专门评估。最后区分论文发现、仓库细节、本站合成演示和后续研究建议。 这种证据意识也是理解方法的一部分。"},"source":{"label":"§2–§6 · synthesis and teaching route","url":"https://arxiv.org/html/2610.13912v1#S5"},"widget":"video","check":{"question":{"en":"Which statement correctly labels its evidence?","zh":"哪个陈述正确标注证据？"},"options":{"en":["Our toy arithmetic reproduces the authors’ model training","The four-route coupled study is a proposed follow-up","The therapeutic nomination is an experimentally validated treatment"],"zh":["教学计算复现作者模型训练","四路线耦合研究是后续建议","治疗提名是实验证实的疗法"]},"answer":1,"explanation":{"en":"The proposed study is not a reported experiment; demos and hypotheses also have distinct evidence status.","zh":"建议研究不是已报告实验，演示和假设也有各自证据状态。"}}}],"glossary":[{"term":"Recursive self-improvement (RSI)","en":"Experience produces accepted system revisions that persist and shape later interaction and learning.","zh":"递归自我改进：经验产生验收后的持久系统修订，并影响后续交互与学习。"},{"term":"Policy configuration θ","en":"The parameters or persistent workflow that determines candidate generation or selection.","zh":"策略配置 θ：决定候选生成或选择的参数或持久工作流。"},{"term":"World model φ","en":"A domain predictor of consequences under candidate actions; its supported output interface must be specified.","zh":"世界模型 φ：预测候选行动后果的领域模型，必须说明支持什么输出接口。"},{"term":"Task state s","en":"The current task object and information, such as a program with tests and feedback.","zh":"任务状态 s：当前任务对象及信息，例如程序、测试与反馈。"},{"term":"Domain adapter","en":"The interface binding domain states, actions, predictions, and feedback to the common protocol.","zh":"领域适配器：把领域状态、行动、预测与反馈接入共用协议的接口。"},{"term":"Action step t","en":"An interaction step inside a task, distinct from a system update cycle.","zh":"行动步骤 t：任务内部的交互步骤，与系统更新周期不同。"},{"term":"Update cycle k","en":"A cycle ending in update and acceptance decisions, even if no new version is retained.","zh":"更新周期 k：以更新和验收决策结束的周期，即使没有新版本被保留。"},{"term":"JEPA","en":"Joint-embedding predictive architecture: predict target representations from context rather than reconstructing every detail.","zh":"联合嵌入预测架构：从上下文预测目标表征，而不必重建每个细节。"},{"term":"Latent representation z","en":"A learned internal representation used for prediction, not necessarily directly interpretable.","zh":"潜在表征 z：用于预测的学习内部表征，不一定可直接解释。"},{"term":"Orthogonal predictive factorization (OPF)","en":"JEPA-Anything’s factor organization, dedicated prediction, and synthesis foundation; exact factor independence is not independently established here.","zh":"正交预测分解：JEPA-Anything 的因素组织、专门预测及合成基础；本课没有独立证明因素严格独立。"},{"term":"Outcome readout R","en":"Converts a predicted latent target into the outcome value or distribution needed by the domain.","zh":"结果读出 R：把预测潜在目标转成领域所需结果值或分布。"},{"term":"Rollout / imagined trajectory","en":"A predicted action sequence whose future states remain predictions until externally checked.","zh":"展开／想象轨迹：未来状态在外部核查前仍属于预测的行动序列。"},{"term":"Verifier","en":"Records candidate validity, utility, evidence provenance, and available uncertainty.","zh":"验证器：记录候选有效性、效用、证据来源及可用不确定性。"},{"term":"Utility","en":"A declared task-value measure used by a ranking or acquisition rule.","zh":"效用：排序或信息获取规则采用的、预先声明的任务价值度量。"},{"term":"Uncertainty","en":"A specified estimate of predictive ambiguity; it is not automatically equivalent to observed reliability.","zh":"不确定性：指定方法给出的预测不明确程度估计，不自动等同于实证可靠性。"},{"term":"Acquisition rule","en":"A declared rule selecting candidates for feedback, potentially including information-seeking evaluation.","zh":"信息获取规则：决定哪些候选获得反馈的规则，可包含主动获取信息的评估。"},{"term":"Evidence provenance","en":"The recorded origin of a claim or observation, kept separate from its sufficiency for a use.","zh":"证据来源：记录判断或观察从何而来，与是否足以用于某用途分开。"},{"term":"E0 / E1 / E2 / E3","en":"Rule checks / learned predictions / specialized simulation or higher-fidelity calculation / external measurement.","zh":"E0／E1／E2／E3：规则检查／学习预测／专门模拟或高保真计算／外部测量。"},{"term":"Prediction–observation pair","en":"Linked but separate forecast and observed outcome, with action, context, source, and generating version.","zh":"预测—观察对：关联但分开的预测与观察，连同行动、上下文、来源及生成版本保存。"},{"term":"Training admission","en":"A separate filter deciding whether imagined evidence may be used for learning.","zh":"训练准入：单独判断想象证据能否用于学习的过滤过程。"},{"term":"Reliability / coverage","en":"Agreement with observed outcomes over the candidate range covered by attributable evidence.","zh":"可靠性／覆盖：在可归属证据所覆盖候选范围内，与观察结果的一致程度。"},{"term":"Insufficient","en":"A distinct reliability verdict indicating inadequate evidence or coverage; it does not trigger Equation 11.","zh":"证据不足：证据或覆盖不够的独立可靠性状态，不触发公式 11。"},{"term":"Conditional adaptation","en":"A model-update attempt requiring unreliability, sufficient adaptation data, and budget.","zh":"条件适配：同时要求不可靠、适配数据充分与预算足够的模型更新尝试。"},{"term":"Component gate","en":"A predeclared check comparing one proposed component against its current version.","zh":"组件门控：按预先规定条件，将候选组件与当前版本比较。"},{"term":"Compatibility / pair gate","en":"An acceptance check on assembled policy–model behavior and predictor suitability.","zh":"兼容性／组合门控：检查组装策略—模型的联合行为及预测器适用性。"},{"term":"Retained pair","en":"The accepted policy and predictor used for subsequent interaction; pair failure preserves the old pair.","zh":"保留组合：后续交互使用的已接受策略和预测器；组合失败保留旧组合。"},{"term":"Brier score","en":"Squared error of class probabilities against observed one-hot outcomes; lower is better.","zh":"Brier 分数：类别概率与真实独热结果的平方误差，越低越好。"},{"term":"Percentage point / relative percent","en":"A direct difference between percentage rates / a proportional change relative to a reference rate.","zh":"百分点／相对百分比：百分率的直接相减／相对于参照率的比例变化。"},{"term":"Best-so-far yield","en":"The maximum yield observed up to a budget count; it is monotonic by definition.","zh":"历史最佳产率：截至某预算步观察到的最大产率，按定义单调不降。"},{"term":"Held-out audit","en":"Protected evaluation data reserved for reporting, distinct from training and version-selection data.","zh":"留出审计：保留用于最终报告的数据，与训练和版本选择数据区分。"}],"qa":[{"question":{"en":"Why is accumulating experience not enough for RSI?","zh":"为什么积累经验还不足以构成 RSI？"},"answer":{"en":"A longer history can change available information without revising the decision system. RSI-Anything distinguishes task state and records from accepted policy or world-model configurations. Recursiveness arises when retained revisions change later proposals, selections, and learning experience.","zh":"历史变长可以改变可用信息，却不一定修订决策系统。本文区分任务状态、记录与验收后的策略或模型配置。保留修订改变后续提案、选择与学习经验时，才形成本文强调的递归机制。"},"source":"https://arxiv.org/html/2610.13912v1#S2.SS1"},{"question":{"en":"Must θ always be neural-network weights?","zh":"θ 一定是神经网络权重吗？"},"answer":{"en":"No. The policy configuration can be trainable parameters or a persistent agent workflow. The implementation must state what fields can change, what feedback scores or training targets justify a candidate, and how the resulting version is accepted.","zh":"不一定。策略配置可以是可训练参数，也可以是持久智能体工作流。实现需说明允许变化的字段、用于构建候选的反馈分数或训练目标，以及验收方式。"},"source":"https://arxiv.org/html/2610.13912v1#S2.SS4"},{"question":{"en":"Does every domain use one shared world model?","zh":"所有领域共用一个世界模型吗？"},"answer":{"en":"The shared object is the improvement procedure and interface contract. Domains bind their own states, actions, predictors, targets, and feedback sources. Reusing notation and the JEPA-Anything foundation does not establish shared parameters or a single model trained across all reported applications.","zh":"共用的是改进流程与接口契约。各领域绑定自己的状态、行动、预测器、目标和反馈来源。共享符号和 JEPA-Anything 基础，并不意味着报告应用共用同一组权重或单个模型。"},"source":"https://arxiv.org/html/2610.13912v1#S6"},{"question":{"en":"Why does one-step prediction not guarantee multistep planning?","zh":"为什么单步结果预测不保证多步规划能力？"},"answer":{"en":"Ranking can use an outcome readout alone. A rollout additionally needs an adapter that propagates a future planning state, so another action can be evaluated from it. Predicted states remain unobserved until checked. A final-yield distribution alone does not supply every intermediate state.","zh":"排序只需要结果读出；多步展开还需适配器推进未来规划状态，让后续行动从该状态继续评估。预测状态在核查前仍未被观察。最终产率分布本身并不提供全部中间状态。"},"source":"https://arxiv.org/html/2610.13912v1#S2.SS2"},{"question":{"en":"Are uncertain candidates always excluded?","zh":"不确定候选一定被排除吗？"},"answer":{"en":"No. Invalid candidates are excluded, but uncertainty handling depends on the declared selection rule. Utility ranking may penalize uncertainty; an explicitly enabled information-seeking acquisition rule may prioritize it. Training admission is separate, so a candidate can deserve evaluation without qualifying as imagined training data.","zh":"不是。无效候选被排除，不确定性怎样处理取决于声明选择规则。效用排序可惩罚不确定性，明确启用的信息获取规则也可优先评估它。训练准入独立，因此候选可值得测试，却不能作为想象训练数据。"},"source":"https://arxiv.org/html/2610.13912v1#S2.SS3"},{"question":{"en":"Do E0–E3 form automatic truth levels?","zh":"E0–E3 是自动的真值等级吗？"},"answer":{"en":"They describe evidence origin and intended fidelity. Suitability depends on quality and admission criteria. External measurement can have error; a learned forecast can be useful without becoming an observation. Preserve provenance rather than collapsing all sources into a single undifferentiated feedback value.","zh":"它们描述来源与预期保真度，适用性仍取决于质量和准入标准。外部测量可能有误差，学习预测可以有用却不成为观察。应保存来源，而不是把所有信息压成没有区分的反馈值。"},"source":"https://arxiv.org/html/2610.13912v1#S2.SS3"},{"question":{"en":"Why not overwrite a forecast after seeing the answer?","zh":"知道答案后，为什么不直接覆盖预测？"},"answer":{"en":"The original prediction explains the past selection and enables an error comparison. The observation supplies a distinct target. Overwriting erases that diagnostic information. Link them to the input, action, source, and generating version; current reliability must use attributable current-version predictions.","zh":"原预测解释过去为何选择，也支持误差比较；观察提供不同的监督目标。覆盖预测会抹掉诊断信息。应关联输入、行动、来源和生成版本；当前可靠性要使用可归属于当前版本的预测。"},"source":"https://arxiv.org/html/2610.13912v1#S2.SS4"},{"question":{"en":"Does insufficient reliability evidence trigger adaptation?","zh":"可靠性证据不足会触发适配吗？"},"answer":{"en":"No. Equation 11 requires an unreliable verdict plus sufficient adaptation data and budget. Insufficient is a separate state, often reflecting coverage limits, and is not evidence of reliability. Subsequent evaluation follows the declared selection rule rather than an invented automatic trigger.","zh":"不会。公式 11 要求判定不可靠，并且适配数据和预算充分。证据不足是独立状态，常反映覆盖限制，也不是可靠证明。后续评估按声明规则进行，不能自行发明自动触发。"},"source":"https://arxiv.org/html/2610.13912v1#S2.SS4"},{"question":{"en":"Can scalar feedback train the entire next-state representation?","zh":"一个标量反馈能监督完整下一状态表征吗？"},"answer":{"en":"A scalar result supplies an outcome target, not a fully observed target state. Its loss can update upstream parameters when those parameters are trainable, but that does not make the scalar a complete state observation. Target type, loss, and trainable subset must be specified.","zh":"标量结果提供结果目标，不提供完整下一状态观察。如果上游参数可训练，其损失可传到上游，但这不使标量变成完整状态。必须说明目标类型、损失和可训练范围。"},"source":"https://arxiv.org/html/2610.13912v1#S2.SS4"},{"question":{"en":"If both components pass separately, is pair acceptance guaranteed?","zh":"两个组件分别通过，组合就一定通过吗？"},"answer":{"en":"No. A new policy can shift the candidate distribution, and a new model can change rankings. The pair check evaluates joint decisions and prediction suitability under the assembled policy. Pair failure retains the entire current pair, not an arbitrary untested mixture.","zh":"不保证。新策略改变候选分布，新模型改变排序。组合检查评估联合决策，以及预测器对组装策略的适用性。组合失败保留整个当前组合，而不是任意未测试混合。"},"source":"https://arxiv.org/html/2610.13912v1#S2.SS5"},{"question":{"en":"Was the code generator trained during the repair comparison?","zh":"修复比较中训练了代码生成器吗？"},"answer":{"en":"ReasonFlux-Coder-7B is fixed. Programs and feedback change, while the comparison varies selection and W1 predictor settings. This helps distinguish predictive selection from predictor adaptation. It does not demonstrate joint training of coder and world model.","zh":"ReasonFlux-Coder-7B 固定。程序和反馈变化，比较改变的是选择方式与 W1 预测器设置。这有助区分预测选择和预测器适配，但不能据此声称代码生成器与世界模型联合训练。"},"source":"https://arxiv.org/html/2610.13912v1#S3.SS1"},{"question":{"en":"Does the released final code evaluation adapt W1 online every episode?","zh":"发布的最终代码评估每个回合都在线适配 W1 吗？"},"answer":{"en":"The official reproduction guide says final evaluation performs no optimizer updates. Adaptation is a four-stage training chain on recorded transitions, followed by checkpoint evaluation. Our within-cycle adaptation animation is synthetic pedagogy, not a literal replay of optimizer timing in the 600 reported episodes.","zh":"官方复现指南说明最终评估不做优化器更新。适配是在记录转移上的四阶段训练链，再评估检查点。本站周期内适配动画是教学合成，不是对 600 次评估中优化器时序的真实重放。"},"source":"https://github.com/Gen-Verse/RSI-Anything/blob/main/docs/reproduction.en.md"},{"question":{"en":"Why report both ranking accuracy and Brier score?","zh":"为什么同时报告排序准确率与 Brier 分数？"},"answer":{"en":"Ranking accuracy assesses candidate ordering; Brier assesses class-probability error. Either can change without an identical change in the other. Figure 3c reports both for the static verifier versus fixed world model; it does not report an adaptive-model Brier value.","zh":"排序准确率评估候选顺序，Brier 评估类别概率误差，两者不必同步等幅变化。图 3c 对静态验证器与固定世界模型报告这两个指标，没有提供适配模型 Brier 值。"},"source":"https://arxiv.org/html/2610.13912v1#S3.SS1"},{"question":{"en":"Does 99% checkbox success isolate world-model ranking?","zh":"复选框 99% 成功率隔离了世界模型排序作用吗？"},"answer":{"en":"No. The official GUI results guide says the development-selected controller has alpha=0 and follows policy ranking. Pure world-based control ranks the same policy candidates using model values. The endpoint is reported performance, but it is not an isolated causal estimate of model-based ranking.","zh":"没有。官方 GUI 结果指南说开发选中控制器 alpha=0，跟随策略排序；纯世界模型控制器用模型值排序相同策略候选。99% 是已报告表现，但不是模型排序作用的独立因果估计。"},"source":"https://github.com/Gen-Verse/RSI-Anything/blob/main/tasks/gui/docs/RESULTS.md"},{"question":{"en":"Can we recover OSWorld’s absolute endpoint from +18.4%?","zh":"能由 +18.4% 还原 OSWorld 绝对成功率吗？"},"answer":{"en":"Not without the absolute reference rate. The figure gives relative improvement, meaning the endpoint is 1.184 times the initial rate. It is not an 18.4-point addition. The reported +5.5% versus RLAnything uses a different denominator.","zh":"没有绝对参照率就不能。图给相对改进，表示端点为初始率的 1.184 倍，不是增加 18.4 点。相对 RLAnything 的 +5.5% 使用另一分母。"},"source":"https://arxiv.org/html/2610.13912v1#S3.SS2"},{"question":{"en":"Does the lab score prove reliable physical execution?","zh":"实验室分数证明了可靠物理执行吗？"},"answer":{"en":"No. F200 Level-2 Final Score combines action-sequence similarity and parameter accuracy. The five-version progression supports planning improvement. Real equipment introduces execution interfaces and failure modes requiring evaluation on the relevant apparatus and workflow.","zh":"没有。F200 二级 Final Score 结合序列相似度与参数准确性。五版本递进支持规划改进；实体设备还有执行接口和失败模式，需要在相应仪器与流程上验证。"},"source":"https://arxiv.org/html/2610.13912v1#S3.SS3"},{"question":{"en":"Does the released chemistry loop run fresh wet-lab experiments each step?","zh":"发布化学循环每步都做新湿实验吗？"},"answer":{"en":"The released flow guide describes replay of a 321-condition measured pool across 100 runs, with eight initial observations counted inside forty. Predictions are frozen and feedback changes expected-improvement selection. This is measured-data sequential selection, not proof of new live experiments at each inference step.","zh":"发布的流动指南说明，在 321 条件实测池上重放一百次，八个初始观察计入四十次。预测冻结，反馈改变期望改进选择。这是实测数据顺序选择，不是每步推理都做新实体实验的证明。"},"source":"https://github.com/Gen-Verse/RSI-Anything/blob/main/tasks/reaction_optimization/README.md"},{"question":{"en":"Why can’t we merge the chemistry endpoints?","zh":"为什么不能合并两组化学端点？"},"answer":{"en":"The GC and flow LC–MS screens differ in reaction setup, condition space, analysis, and observation budget. Their gains are within-screen comparisons. Best observed and mean best observed are also stated separately. Combining them would obscure what was controlled and measured.","zh":"GC 与流动 LC–MS 在反应设置、条件空间、分析和观察预算上不同，增益是在各自筛选内比较。最佳已观察和平均最佳已观察也分别表述。合并会掩盖控制条件与测量对象。"},"source":"https://arxiv.org/html/2610.13912v1#S3.SS4"},{"question":{"en":"Is the immune nomination a validated therapy?","zh":"免疫提名是已验证疗法吗？"},"answer":{"en":"It is a prospective hypothesis combining SIRPα inhibition and IL-36γ-axis modulation for later experimental testing. The construction stage retains a workflow and predictor; downstream analysis revises hypotheses with predictor parameters frozen. Neither distinction establishes therapeutic efficacy.","zh":"它是结合 SIRPα 抑制和 IL-36γ 轴调节、供后续实验检验的前瞻假设。构建阶段保留工作流和预测器，下游参数冻结并修订假设。这些过程并不建立治疗有效性。"},"source":"https://arxiv.org/html/2610.13912v1#S3.SS5"},{"question":{"en":"What is the strongest missing evaluation?","zh":"最关键的待补评估是什么？"},"answer":{"en":"The paper calls for joint multiround evaluation of sustained mutual policy–world-model improvement within one task. A useful proposed study compares update routes over time, audits current-distribution reliability, matches clearly defined resources, and protects final evaluation from repeated version selection.","zh":"论文要求在同一任务中联合多轮评估策略与世界模型持续相互改进。可行建议是跨时比较更新路线，审计当前分布可靠性，匹配明确资源，并保护最终评估免受反复版本选择影响。"},"source":"https://arxiv.org/html/2610.13912v1#S5"}]},{"figures":[{"id":1,"src":"media/originals/figure-1.png","title":{"en":"From predictive foundation to an improvement loop","zh":"从预测基础到自我改进闭环"},"caption":{"en":"The opening overview places a shared predictive design underneath domain-specific tasks and a feedback loop above them. This is a conceptual map, rather than a result plot.","zh":"开篇总览把共享的预测设计放在底层，把各领域任务与反馈闭环联系起来。这是一张概念地图，并非实验结果图。"},"reading":{"en":["Start at JEPA-Anything: the inherited contribution is a way to construct latent predictive models across different data types. RSI-Anything adds rules for using predictions and retaining changes.","Follow the outward path into different domains. Each domain still supplies its own states, actions, prediction targets, feedback and evaluation; a shared mechanism does not imply one universal trained predictor.","Follow feedback back toward the system. An observed outcome can improve the policy or persistent workflow, and can justify an attempt to adapt the predictor.","The closing arrow represents the retained policy–model pair shaping later experience. Saving more observations alone is not a change to either component."],"zh":["先看 JEPA-Anything：继承的是跨数据类型构建潜在预测模型的设计。RSI-Anything 增加了如何使用预测、如何保留系统变化的规则。","再沿路径看不同领域。每个领域仍要自行定义状态、动作、预测目标、反馈与评估；共享机制不等于一个训练好的通用预测器包办所有任务。","沿反馈路径返回系统。观察到的结果可以改进策略或持久工作流，也可能为一次预测器适配尝试提供理由。","闭合箭头表示：保留下来的策略与模型组合会改变下一轮经验。仅仅存下更多观察，并不等于策略或模型发生了更新。"]},"source":{"label":"Paper v1 · Figure 1","url":"https://arxiv.org/html/2610.13912v1#S0.F1"},"page":2},{"id":2,"src":"media/originals/figure-2.png","title":{"en":"The six operations and the three decisions","zh":"六步操作与三个不同的决定"},"caption":{"en":"The central framework separates choosing an action, deciding whether to attempt an update, and accepting a proposed system version. Its domain panel shows different bindings of this common contract.","zh":"核心框架区分了选择动作、决定是否尝试更新，以及接受哪个系统版本。下方领域面板展示同一机制的不同具体绑定。"},"reading":{"en":["Read panel a from candidate proposals to predictions and selection. Several candidates may be forecast, while only an executed candidate produces its paired external observation.","Keep the prediction beside the observation, with the action, context and system version that generated it. Without that pairing, a failure cannot be attributed to the predictor used in the decision.","The update branch has separate policy and model pathways. World-model adaptation requires an unreliable assessment, sufficient adaptation data and enough budget; insufficient coverage is a separate state.","Acceptance is another decision. A proposed component must pass its own check, and the assembled policy–model pair must pass a compatibility check before being retained; pair failure preserves the previous pair.","Panel b is a map of applications, not evidence that every application exercised all update pathways. Read it together with Table 4."],"zh":["先从 a 面板的候选生成读到预测与选择。可以预测多个候选，但只有真正执行的候选能产生与其配对的外部观察。","把预测和观察并排记录，同时保留动作、上下文与产生预测的系统版本。缺少这种配对，就无法判断决策时使用的预测器究竟哪里出了问题。","更新分支中的策略与世界模型可以各自行动。模型适配需要同时满足“不可靠、有足够适配数据、预算足够”；覆盖不足是另一个状态。","验收是第三个决定。候选组件先通过各自检查，组装后的策略与模型还要通过兼容性检查才能保留；组合不通过则保留原组合。","b 面板展示应用地图，并不说明每个应用都实际执行了全部更新路径；需要结合 Table 4 阅读。"]},"source":{"label":"Paper v1 · Figure 2","url":"https://arxiv.org/html/2610.13912v1#S1.F2"},"page":4},{"id":3,"src":"media/originals/figure-3.png","title":{"en":"Code repair: isolate selection and predictor adaptation","zh":"代码修复：分离选择收益与预测器适配收益"},"caption":{"en":"The code study keeps the code-generating policy fixed, making it useful for separating predictive candidate selection from further improvement of the predictor.","zh":"代码实验固定了代码生成策略，因此适合分开理解：预测引导选择带来多少收益，进一步适配预测器又带来多少收益。"},"reading":{"en":["Panel a is an illustrative program repair. It draws three example patches for readability, but the benchmark actually proposes four revisions per round and allows at most three feedback rounds.","Read panel b together with Table 2: static verification gives 26.3% hidden-test success, fixed world-model selection 29.2%, and world-model adaptation 31.2%. The generator remains ReasonFlux-Coder-7B.","Panel c checks the link from prediction to decisions. In the static-verifier versus fixed-WM comparison, ranking accuracy rises from 66.5% to 72.8% and Brier score falls from 0.488 to 0.358; the adaptive arm is not the arm in this diagnostic.","Panel d checks feedback usage: online test-suite calls per task remain about 3.7. This supports similar external test usage, rather than equal total training or inference computation.","Panels e and f extend selection evaluation to APPS Introductory and LiveCodeBench v6. Their 46.37% and 33.05% metrics are mean complete-suite success across three seeds; do not substitute public-test success."],"zh":["a 面板是程序修复示意图。为便于阅读只画了三个补丁，但基准实验每轮实际提出四个修订，最多进行三轮反馈。","把 b 面板与 Table 2 一起读：静态验证器的隐藏测试成功率为 26.3%，固定世界模型为 29.2%，适配世界模型为 31.2%；生成器始终是 ReasonFlux-Coder-7B。","c 面板检查“预测是否有助于决策”。静态验证器与固定世界模型比较时，排序准确率从 66.5% 升到 72.8%，Brier 分数从 0.488 降到 0.358；这里不是适配模型的诊断结果。","d 面板检查反馈用量：每题在线测试套件调用约为 3.7 次。这说明外部测试用量相近，不能据此说总训练与推理计算量完全相同。","e、f 面板把选择评估扩展到 APPS Introductory 与 LiveCodeBench v6。46.37% 与 33.05% 是三个种子的完整测试套件成功率均值，不能替换成公开测试通过率。"]},"source":{"label":"Paper v1 · Figure 3","url":"https://arxiv.org/html/2610.13912v1#S3.F3"},"page":12},{"id":4,"src":"media/originals/figure-4.png","title":{"en":"GUI results: read success, actions and errors together","zh":"GUI 结果：成功率、动作与错误要一起看"},"caption":{"en":"The GUI figure combines two environments and several diagnostics. Relative improvements on OSWorld use a different unit from the percentage-point changes between MiniWoB++ success rates.","zh":"GUI 图同时展示两个环境与多项诊断。OSWorld 使用相对提升百分比，其单位不同于 MiniWoB++ 成功率之间的百分点差。"},"reading":{"en":["Panels a and b illustrate a checkbox task and a spreadsheet task. They explain what an action and an observable target state mean, rather than reporting a single shared benchmark.","Panel c shows MiniWoB++ selected-controller success of 51%, 79% and 99% across three evaluated configurations. The world-based control follows a separate 49%, 96%, 98% sequence.","Read panels e–g jointly: the intermediate configuration uses only 2.93 actions on average but has 21 incorrect-submission episodes. The final configuration uses 3.21 actions and has only one such episode.","The 39.4% action reduction compares 5.30 baseline actions with 3.21 final actions. It is a relative reduction in actions, not a 39.4-percentage-point success gain.","OSWorld gains are relative: RSI-Anything is +18.4% versus the initial agent and +5.5% versus RLAnything. The figure does not supply an absolute success rate from which to claim an 18.4-point gain.","The official repository further separates development-selected policy ranking from pure world-based ranking. The 99% selected-controller endpoint should not be treated as an isolated ablation of world-model ranking."],"zh":["a、b 面板分别示意复选框任务与电子表格任务，帮助理解动作与可观察目标状态；它们不是一个共同基准中的两张截图。","c 面板给出 MiniWoB++ 选定控制器三个配置的成功率：51%、79%、99%。世界模型排序控制组另有 49%、96%、98% 的结果。","e–g 要联合阅读：中间配置平均只用 2.93 个动作，却有 21 个错误提交回合；最终配置平均 3.21 个动作，错误提交仅 1 个。","动作减少 39.4% 比较的是基线 5.30 与最终 3.21；这是动作数量的相对降幅，不是成功率增加 39.4 个百分点。","OSWorld 使用相对提升：相对初始智能体提高 18.4%，相对 RLAnything 提高 5.5%。图中没有给出足以把它解释成 18.4 个百分点的绝对成功率。","官方仓库还区分了开发集选定的策略排序与纯世界模型排序。99% 的选定控制器端点，不能当成单独隔离世界模型排序作用的消融证据。"]},"source":{"label":"Paper v1 · Figure 4","url":"https://arxiv.org/html/2610.13912v1#S3.F4"},"page":14},{"id":5,"src":"media/originals/figure-5.png","title":{"en":"Lab planning: follow retained policy versions","zh":"实验室规划：跟踪保留的策略版本"},"caption":{"en":"This figure follows five versions of one 4B policy in development order on the same 200-task F200 Level-2 benchmark. The score measures plan alignment, not successful robot execution.","zh":"本图在相同的 200 任务 F200 Level-2 基准上，按开发顺序比较一个 4B 策略的五个版本。评分衡量计划对齐程度，并非机器人执行成功率。"},"reading":{"en":["Panel a connects a protocol, proposed action sequences and parameter choices to predictive evaluation and an execution plan. Dashed arrows represent possible update routes in the framework.","Panels b and c follow five retained policy versions: 21.80%, 38.03%, 41.99%, 44.56% and 46.01%. The total increase is 24.21 percentage points.","Final Score combines action-sequence similarity and parameter accuracy. Read 46.01% as a benchmark score, rather than the fraction of wet-lab experiments completed successfully.","The dashed 45.32% line is the Actor–Simulator–Selector reference. The last version is higher by 0.69 percentage points; model size alone does not control all resources in the compared systems.","The x-axis is development order with schematic spacing. It does not report equal training cost per version, and the plotted progression does not by itself measure a jointly improving predictor."],"zh":["a 面板把实验规程、候选动作序列与参数选择，接到预测评估和执行计划。虚线表示框架中可能启用的更新路径。","b、c 面板跟踪五个保留的策略版本：21.80%、38.03%、41.99%、44.56%、46.01%，总共增加 24.21 个百分点。","Final Score 结合动作序列相似度与参数准确度。46.01% 是基准评分，不能理解为湿实验成功完成比例。","45.32% 虚线是 Actor–Simulator–Selector 参考系统。最终版本高出 0.69 个百分点；比较模型大小并不意味着其他资源全部受控。","横轴表示开发顺序，间距只是示意，不代表每个版本耗费相同训练成本；这条上升曲线本身也没有量化世界模型与策略共同进步。"]},"source":{"label":"Paper v1 · Figure 5","url":"https://arxiv.org/html/2610.13912v1#S3.F5"},"page":15},{"id":6,"src":"media/originals/figure-6.png","title":{"en":"Reaction search: match budgets within each screen","zh":"反应搜索：在各自筛选内匹配实验预算"},"caption":{"en":"The two halves concern separate Suzuki–Miyaura screening protocols. Each endpoint compares methods at the same observation count within its own screen.","zh":"上下两部分是两个独立的 Suzuki–Miyaura 筛选协议。每个端点只在其所属筛选内部，用相同观察次数比较方法。"},"reading":{"en":["Read panels a–c as the GC screen: after 20 observations, the best observed yield is 93.0% for RSI-Anything and 87.5% for Bayesian optimization, a difference of 5.5 percentage points.","Read panels d–f separately as the flow LC–MS screen: after 40 observations, mean best observed yield is 96.15% versus 82.16%, a difference of 13.99 percentage points.","A best-so-far curve cannot decrease: it remembers the highest measured yield seen so far. It is not a claim that every next experiment has a higher yield.","The chemical structures and arrows explain condition choice and feedback. They do not establish that every observation caused a neural-network weight update.","The official flow-screen release replays measured yields from a fixed pool of 321 conditions with eight initial observations included in the budget of 40. Its prediction table remains frozen while feedback changes expected-improvement selection.","These screen-specific results support efficient search in the reported pools and budgets; they do not establish transfer to arbitrary reactions, or the performance of an autonomous laboratory."],"zh":["a–c 单独看作 GC 筛选：20 次观察后，RSI-Anything 的已观察最佳产率为 93.0%，贝叶斯优化为 87.5%，相差 5.5 个百分点。","d–f 单独看作流动 LC–MS 筛选：40 次观察后，平均已观察最佳产率为 96.15% 与 82.16%，相差 13.99 个百分点。","“至今最佳”曲线不会下降，因为它记录此前见过的最高实测产率；这并不表示每次后续实验的产率都更高。","化学结构和箭头解释条件选择与反馈，不足以证明每次观察都会引起神经网络权重更新。","官方流动筛选发布版本从 321 个条件的固定池中顺序回放实测产率，40 次预算包含初始 8 次观察。预测表保持冻结，反馈改变的是期望改进的选择。","这些结果支持在论文筛选池与预算内提高搜索效率，尚不能推出对任意反应的迁移能力，也不能等同于自主实验室的整体表现。"]},"source":{"label":"Paper v1 · Figure 6","url":"https://arxiv.org/html/2610.13912v1#S3.F6"},"page":17},{"id":7,"src":"media/originals/figure-7.png","title":{"en":"Immune science: construction and analysis are different stages","zh":"免疫科学：模型构建与下游分析分阶段"},"caption":{"en":"The application joins scientific-workflow evolution, immune-world-model construction and downstream analysis. Its final therapeutic combination is a hypothesis awaiting experimental validation.","zh":"该应用把科学工作流演化、免疫世界模型构建和下游分析连接起来。最终治疗组合是等待实验验证的假设。"},"reading":{"en":["Read panel A in stages. During construction, workflow search selects a persistent model-building workflow; that workflow produces the immune predictor.","During downstream analysis, the constructed predictor is frozen. The analysis state, tool use, intervention candidates and hypothesis ranking
