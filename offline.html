can still change through inference and self-correction.","Panel B makes the action-conditioned prediction concrete: cellular, tissue and individual contexts form the state, while an intervention supplies the action whose consequences are forecast.","Measured perturbations support development and withheld interventions or contexts assess forecasting. A predicted biological readout and a measured outcome retain different evidential roles.","The SIRPα inhibition plus IL-36γ-axis modulation nomination is prospective. Neither this framework diagram nor the paper establishes therapeutic efficacy in clinical use."],"zh":["A 面板要分阶段读：构建阶段通过工作流搜索，选择持久的模型构建工作流，再由该工作流产出免疫预测器。","下游分析时预测器冻结。分析状态、工具调用、干预候选和假设排序，仍可通过推理与自我纠正发生变化。","B 面板具体解释动作条件预测：细胞、组织与个体上下文构成状态，干预是动作，模型预测其后果。","实测扰动数据支持模型开发，留出的干预或上下文检验预测。模型产生的生物读出与实测结果承担不同的证据角色。","SIRPα 抑制与 IL-36γ 轴调节的组合是前瞻性提名。本框架图和论文都没有建立其临床治疗有效性。"]},"source":{"label":"Paper v1 · Figure 7","url":"https://arxiv.org/html/2610.13912v1#S3.F7"},"page":18}],"tables":{"code":[{"method":{"en":"Random-K","zh":"随机选择 Random-K"},"success":26,"calls":3.72},{"method":{"en":"Capacity-matched static verifier","zh":"容量匹配的静态验证器"},"success":26.3,"calls":3.72},{"method":{"en":"RSI-Anything · fixed WM","zh":"RSI-Anything · 固定世界模型"},"success":29.2,"calls":3.71},{"method":{"en":"RSI-Anything · adaptive WM","zh":"RSI-Anything · 适配世界模型"},"success":31.2,"calls":3.72}],"lab":[{"version":"V1","score":21.8},{"version":"V2","score":38.03},{"version":"V3","score":41.99},{"version":"V4","score":44.56},{"version":"V5","score":46.01}],"bindings":[{"domain":{"en":"Code repair","zh":"代码修复"},"policy":{"en":"ReasonFlux-Coder-7B is fixed; four revisions are proposed per round.","zh":"ReasonFlux-Coder-7B 固定，每轮生成四个修订。"},"worldModel":{"en":"W1: JEPA-Anything-based Qwen2.5-Coder-3B-Instruct with LoRA; predicts five-class execution probabilities. Compare fixed W1 with feedback-adapted W1.","zh":"W1：基于 JEPA-Anything 设计、以 LoRA 适配 Qwen2.5-Coder-3B-Instruct，预测五类执行概率；比较固定 W1 与反馈适配 W1。"},"feedback":{"en":"Online execution-test feedback; final hidden-suite success and online calls per task.","zh":"在线执行测试反馈；最终隐藏测试成功率与每题在线调用次数。"},"limit":{"en":"Isolates selection and predictor adaptation with a fixed generator. Similar online calls do not establish equal total compute.","zh":"固定生成器，分离选择与预测器适配收益；在线调用相近不等于总计算量相同。"}},{"domain":{"en":"GUI interaction","zh":"GUI 交互"},"policy":{"en":"Action policy is updated from interaction; retained pairs are evaluated as baseline, adapted and final configurations.","zh":"通过交互更新动作策略；评估基线、适配与最终保留组合。"},"worldModel":{"en":"GUI outcome predictor forecasts interface-action consequences and is updated with interaction feedback.","zh":"GUI 结果预测器预测界面动作后果，并根据交互反馈更新。"},"feedback":{"en":"Task outcomes; strict completion and action/error diagnostics.","zh":"任务结果；严格任务完成率以及动作与错误诊断。"},"limit":{"en":"MiniWoB++ checkbox results and OSWorld relative gains are separate evaluations. Repository selected-controller ranking and world-based control must be distinguished.","zh":"MiniWoB++ 复选框结果与 OSWorld 相对提升来自不同评估；仓库中的选定控制器排序需与世界模型排序控制组区分。"}},{"domain":{"en":"Laboratory planning","zh":"实验室规划"},"policy":{"en":"One 4B planning policy, followed through five consecutive retained versions.","zh":"跟踪同一个 4B 规划策略的五个连续保留版本。"},"worldModel":{"en":"JEPA-Anything-based protocol predictor forecasts consequences of action sequences. The reported progression follows policy versions.","zh":"基于 JEPA-Anything 的规程预测器预测动作序列后果；所报告的上升过程跟踪策略版本。"},"feedback":{"en":"Development feedback; Level-1 next-action accuracy and 200-task F200 Level-2 Final Score.","zh":"开发反馈；Level-1 下一动作准确度与 200 任务 F200 Level-2 Final Score。"},"limit":{"en":"Protocol-aligned planning, not verified physical execution; no direct joint policy–model improvement curve.","zh":"衡量规程对齐规划，并非已验证的物理执行；没有直接给出策略与模型共同进步的曲线。"}},{"domain":{"en":"Reaction optimization","zh":"反应优化"},"policy":{"en":"Measured yields guide later condition choices; history and acquisition change across observations.","zh":"实测产率引导后续条件选择，历史记录与采集函数随观察变化。"},"worldModel":{"en":"ReactionT5–JEPA-Anything predicts a yield distribution. The released flow-screen selector uses frozen calibrated predictions.","zh":"ReactionT5–JEPA-Anything 预测产率分布；发布的流动筛选选择器使用冻结的校准预测。"},"feedback":{"en":"GC or LC–MS measured yields; best-so-far metrics at matched observation budgets within each screen.","zh":"GC 或 LC–MS 实测产率；在各筛选内部匹配观察预算比较至今最佳指标。"},"limit":{"en":"Two different screens; the current flow release replays one measured condition pool. Feedback-guided search alone is not evidence of online weight adaptation.","zh":"两个不同筛选；当前流动发布版本回放一个实测条件池。反馈引导搜索本身不证明在线权重适配。"}},{"domain":{"en":"Immune science","zh":"免疫科学"},"policy":{"en":"Scientific workflow evolution selects a model-building workflow; downstream analysis revises interventions and hypotheses.","zh":"科学工作流演化选择模型构建工作流；下游分析修改干预与假设。"},"worldModel":{"en":"Constructed immune world model predicts multiscale transitions and biological readouts; parameters are fixed during downstream analysis.","zh":"构建的免疫世界模型预测多尺度转移与生物读出；下游分析期间参数固定。"},"feedback":{"en":"Measured perturbations for development; withheld interventions and contexts for forecasting assessment.","zh":"实测扰动用于开发；留出的干预与上下文用于预测评估。"},"limit":{"en":"Construction and analysis have different update scopes. The proposed therapeutic combination awaits experiments.","zh":"构建与分析的更新范围不同；提出的治疗组合仍需实验验证。"}}]},"keyCaveats":{"en":["Different applications evaluate different parts of the framework. Sustained mutual policy–world-model improvement in one task requires joint multiround evaluation (§5).","An update-and-acceptance cycle can leave both versions unchanged. Appending experience is not itself a policy or predictor revision (§2.1).","Insufficient observational coverage is not evidence of reliability and does not activate the model-adaptation trigger (§2.4).","Training data, gate data and any held-out final audit have different roles. Accepted performance on a gate does not establish unseen-task generalization (§2.5).","Similar external test calls and matched experiment counts control feedback use, not every source of computation or every possible experimental cost (§3, §6).","GUI relative gains, percentage-point differences, action reductions and planning scores have distinct units and denominators (§3.2–3.3).","The chemistry screens are separate protocols. The current flow-screen release uses a frozen prediction table and sequential replay of measured yields, rather than online retraining at each observation (official repository).","Laboratory planning needs equipment-level execution evaluation; the immune-science therapeutic nomination awaits experimental testing (§5).","All small numerical examples and interactive mechanisms on this learning site are educational syntheses unless explicitly labeled as paper measurements."],"zh":["各应用验证的是框架的不同部分。要证明同一任务中策略与世界模型持续相互促进，仍需联合多轮评估（§5）。","一次更新与验收周期可以让两个版本都保持不变。追加经验本身不是策略或预测器修订（§2.1）。","观察覆盖不足不等于模型可靠，也不会触发模型适配（§2.4）。","训练数据、验收数据与最终留出审计承担不同角色。通过验收集不等于已建立对新任务的泛化能力（§2.5）。","在线测试调用相近、实验次数相同，控制的是外部反馈用量，不是全部计算量或所有实验成本（§3、§6）。","GUI 相对提升、百分点差、动作降幅与规划评分的单位及分母不同（§3.2–3.3）。","化学两个筛选使用不同协议。当前流动筛选发布版本使用冻结预测表并顺序回放实测产率，不是在每次观察后在线重训（官方仓库）。","实验室规划还需设备层面的执行验证；免疫科学中的治疗组合仍等待实验检验（§5）。","学习网站中的小型数值例子和交互机制，除非明确标为论文实测，否则均为教学综合示例。"]}}];const hash=location.hash.match(/^#chapter-(\d+)/);if(hash)state.chapter=Math.max(1,Math.min(20,+hash[1]));render();if(hash)requestAnimationFrame(()=>$('#chapter-'+state.chapter)?.scrollIntoView());window.__rsi={state,lesson,evidence,computeTrace,reliability,retain,frameworkSVG};}catch(e){$('#lesson').innerHTML=`<p>${t('The lesson could not be loaded. Please reload or open the original paper.','学习内容暂时无法载入，请刷新页面或打开原论文。')}</p><a href="https://arxiv.org/abs/2610.13912">arXiv:2610.13912</a>`;console.error(e)}
