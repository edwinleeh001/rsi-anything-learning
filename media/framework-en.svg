<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 568" style="color:#1a2b35;background:white"><rect width="1010" height="568" fill="white"/><text x="35" y="45" fill="#1a2b35" font-family="Arial,PingFang SC,sans-serif" font-size="25">RSI-Anything: prediction, feedback and retained updates</text><g transform="translate(0 70)"><style>.framework-node rect{fill:#e8f0f8;stroke:#d4dfe6}.framework-node text{fill:#1a2b35}.framework-node.selected rect{stroke:#314fbd;stroke-width:2}.framework-node.selected text{fill:#314fbd}.framework-arrow{stroke:#536775;fill:none;stroke-width:1.7}text{font-family:Arial,"PingFang SC",sans-serif}</style><rect width="1010" height="410" fill="#fff"></rect><defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="currentColor"></path></marker></defs><g class="framework-arrow" marker-end="url(#flow-arrow)"><path d="M315 88H358"></path><path d="M645 88H688"></path><path d="M835 140V218"></path><path d="M695 278H652"></path><path d="M365 278H322"></path><path d="M175 225V147"></path></g><g class="framework-node selected" role="button" tabindex="0" data-step="0" aria-label="Propose"><rect x="35" y="35" width="280" height="105" rx="9"></rect><text x="55" y="68" font-size="12" font-family="Inter,Arial">1 / Policy θₖ</text><text x="55" y="108" font-size="24" font-family="Inter,Arial">Propose</text></g><g class="framework-node " role="button" tabindex="0" data-step="1" aria-label="Predict"><rect x="365" y="35" width="280" height="105" rx="9"></rect><text x="385" y="68" font-size="12" font-family="Inter,Arial">2 / World model φₖ</text><text x="385" y="108" font-size="24" font-family="Inter,Arial">Predict</text></g><g class="framework-node " role="button" tabindex="0" data-step="2" aria-label="Select"><rect x="695" y="35" width="280" height="105" rx="9"></rect><text x="715" y="68" font-size="12" font-family="Inter,Arial">3 / Within feedback budget</text><text x="715" y="108" font-size="24" font-family="Inter,Arial">Select</text></g><g class="framework-node " role="button" tabindex="0" data-step="3" aria-label="Observe"><rect x="695" y="225" width="280" height="105" rx="9"></rect><text x="715" y="258" font-size="12" font-family="Inter,Arial">4 / Prediction ≠ observation</text><text x="715" y="298" font-size="24" font-family="Inter,Arial">Observe</text></g><g class="framework-node " role="button" tabindex="0" data-step="4" aria-label="Update"><rect x="365" y="225" width="280" height="105" rx="9"></rect><text x="385" y="258" font-size="12" font-family="Inter,Arial">5 / Conditional, asynchronous</text><text x="385" y="298" font-size="24" font-family="Inter,Arial">Update</text></g><g class="framework-node " role="button" tabindex="0" data-step="5" aria-label="Retain"><rect x="35" y="225" width="280" height="105" rx="9"></rect><text x="55" y="258" font-size="12" font-family="Inter,Arial">6 / Component + pair checks</text><text x="55" y="298" font-size="24" font-family="Inter,Arial">Retain</text></g><text x="505" y="376" text-anchor="middle" fill="currentColor" font-family="Inter,Arial" font-size="15">Retain (θₖ₊₁, φₖ₊₁) only after acceptance; otherwise keep the current pair.</text></g><text x="35" y="540" fill="#536775" font-family="Arial,PingFang SC,sans-serif" font-size="13">Educational synthesis · Cui et al., arXiv:2610.13912v1, §2 · Not an original paper figure</text></svg>